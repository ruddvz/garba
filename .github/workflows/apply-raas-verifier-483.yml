name: Apply RAAS verifier 483

on:
  push:
    branches: [codex/raas-verifier-483]
    paths:
      - '.github/workflows/apply-raas-verifier-483.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/raas-verifier-483
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply RAAS verifier
        run: python3 scripts/tmp-raas-483.py
      - name: Run RAAS self-tests
        run: npm run raas:test
      - name: Verify current harness
        run: npm run raas:verify
      - name: Run full repository validation
        run: npm run check
      - name: Remove temporary integration machinery
        run: git rm -f .github/workflows/apply-raas-verifier-483.yml scripts/tmp-raas-483.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-repository-structure.mjs scripts/raas-verify.mjs scripts/lib/test-raas-verify.mjs package.json
          git commit -m 'Add deterministic RAAS harness verification (#483)'
          git push origin HEAD:codex/raas-verifier-483
