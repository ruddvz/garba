name: Apply issue 803 Nonstop search integration

on:
  push:
    branches:
      - search/nonstop-shared-core-803
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: search/nonstop-shared-core-803
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact bounded patch
        run: python .github/scripts/apply-issue-803.py

      - name: Validate focused search integration
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/runtime/search-core.js
          test ! -e src/search/search-core.js
          node --input-type=module --check < assets/runtime/search-core.js
          node --check nonstop-browser.js
          node --check scripts/lib/test-search-core.mjs
          node scripts/lib/test-search-core.mjs
          node scripts/validate-youtube-player-runtime.mjs

      - name: Run full repository validation
        run: npm run check

      - name: Commit final tree without temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-issue-803-nonstop-search.yml
          rm .github/scripts/apply-issue-803.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Integrate shared search core into Nonstop chooser'
          git push origin HEAD:search/nonstop-shared-core-803
