name: Apply issue 990 coordination starvation patch

on:
  push:
    branches:
      - ci/issue-990-coordination-starvation-v2
    paths:
      - .github/workflows/apply-issue-990-coordination-starvation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/issue-990-coordination-starvation-v2
          fetch-depth: 0

      - name: Apply bounded coordination patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              ".github/workflows/agent-file-claim-conflicts.yml": "agent-file-claim-conflicts",
              ".github/workflows/agent-branch-claim-uniqueness.yml": "agent-branch-claim-uniqueness",
              ".github/workflows/agent-branch-drift.yml": "agent-pre-pr-branch-drift",
              ".github/workflows/agent-claim-hygiene.yml": "agent-claim-hygiene",
          }

          for path, group in files.items():
              p = Path(path)
              text = p.read_text()
              old = (
                  "concurrency:\n"
                  f"  group: {group}\n"
                  "  cancel-in-progress: false"
              )
              new = (
                  "# Non-closed PR checks are read-only and use a PR-specific pending slot, so\n"
                  "# unrelated PRs cannot replace one another. All mutating reconciliation\n"
                  "# stays in the single `global` slot.\n"
                  "concurrency:\n"
                  "  group: " + group + "-" + "$" + "{{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number || 'global' }}\n"
                  "  cancel-in-progress: false"
              )
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one static concurrency block, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          p = Path(".github/workflows/agent-branch-drift.yml")
          text = p.read_text()
          old = """            runSelfTests();
            await ensureDriftLabel();"""
          new = """            runSelfTests();

            // A non-closed PR run is a required, read-only terminal check. Do not
            // mutate drift labels/status/#364 from a PR-specific concurrency slot.
            // Pre-PR drift only describes claimed branches without an open PR, so
            // global reconciliation remains on claim/release/close/schedule/manual events.
            if (context.eventName === 'pull_request' && context.payload.action !== 'closed') {
              const pr = context.payload.pull_request;
              core.summary
                .addHeading('Pre-PR branch drift')
                .addRaw(`PR #${pr.number} completed its PR-scoped coordination check. Repository-wide no-PR drift reconciliation remains serialized in the global lane.`)
                .write();
              return;
            }

            await ensureDriftLabel();"""
          if text.count(old) != 1:
              raise SystemExit(f"agent-branch-drift.yml: expected one mutation boundary, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))

          p = Path(".github/workflows/agent-claim-hygiene.yml")
          text = p.read_text()
          old = """            runSelfTests();
            await ensureReviewLabel();"""
          new = """            runSelfTests();

            // A non-closed PR proves the claimed branch has an open review surface,
            // so hygiene's stale no-PR maintenance is not a PR merge assertion.
            // Return before labels/status/#364 writes; those stay globally serialized
            // on claim/release/close/schedule/manual reconciliation events.
            if (context.eventName === 'pull_request' && context.payload.action !== 'closed') {
              const pr = context.payload.pull_request;
              core.summary
                .addHeading('Agent claim hygiene')
                .addRaw(`PR #${pr.number} completed its PR-scoped coordination check. Repository-wide stale no-PR claim maintenance remains serialized in the global lane.`)
                .write();
              return;
            }

            await ensureReviewLabel();"""
          if text.count(old) != 1:
              raise SystemExit(f"agent-claim-hygiene.yml: expected one mutation boundary, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY

          cat > scripts/lib/test-agent-coordination-concurrency.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const mixed = [
            ['.github/workflows/agent-file-claim-conflicts.yml', 'agent-file-claim-conflicts'],
            ['.github/workflows/agent-branch-claim-uniqueness.yml', 'agent-branch-claim-uniqueness'],
            ['.github/workflows/agent-branch-drift.yml', 'agent-pre-pr-branch-drift'],
            ['.github/workflows/agent-claim-hygiene.yml', 'agent-claim-hygiene'],
          ];

          function groupFor(prefix, eventName, action, prNumber) {
            const prScoped = eventName === 'pull_request' && action !== 'closed';
            return `${prefix}-${prScoped ? prNumber : 'global'}`;
          }

          for (const [path, prefix] of mixed) {
            const source = fs.readFileSync(path, 'utf8');
            const expectedGroup = "group: " + prefix + "-" + "$" + "{{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number || 'global' }}";
            assert.ok(source.includes(expectedGroup), `${path} must use PR-specific concurrency with a global fallback`);
            assert.match(source, /cancel-in-progress:\s*false/, `${path} must not cancel a running check`);
          }

          for (const pr of Array.from({ length: 10 }, (_, index) => index + 101)) {
            for (const [, prefix] of mixed) {
              assert.equal(groupFor(prefix, 'pull_request', 'opened', pr), `${prefix}-${pr}`);
              assert.equal(groupFor(prefix, 'pull_request', 'synchronize', pr), `${prefix}-${pr}`);
            }
          }

          for (const [, prefix] of mixed) {
            const groups = new Set(Array.from({ length: 10 }, (_, index) => groupFor(prefix, 'pull_request', 'opened', index + 101)));
            assert.equal(groups.size, 10, `${prefix}: unrelated PRs must have independent pending slots`);
            assert.equal(groupFor(prefix, 'pull_request', 'closed', 101), `${prefix}-global`);
            assert.equal(groupFor(prefix, 'issue_comment', 'created', null), `${prefix}-global`);
            assert.equal(groupFor(prefix, 'issues', 'closed', null), `${prefix}-global`);
            assert.equal(groupFor(prefix, 'workflow_dispatch', null, null), `${prefix}-global`);
          }

          const drift = fs.readFileSync('.github/workflows/agent-branch-drift.yml', 'utf8');
          const hygiene = fs.readFileSync('.github/workflows/agent-claim-hygiene.yml', 'utf8');
          for (const [name, source, mutationAnchor] of [
            ['branch drift', drift, 'await ensureDriftLabel();'],
            ['claim hygiene', hygiene, 'await ensureReviewLabel();'],
          ]) {
            const guard = "if (context.eventName === 'pull_request' && context.payload.action !== 'closed')";
            assert.ok(source.includes(guard), `${name}: missing non-closed PR read-only guard`);
            assert.ok(source.indexOf(guard) < source.indexOf(mutationAnchor), `${name}: PR guard must precede first mutation boundary`);
          }

          const fileConflicts = fs.readFileSync('.github/workflows/agent-file-claim-conflicts.yml', 'utf8');
          assert.ok(
            fileConflicts.indexOf("if (context.eventName === 'pull_request' && context.payload.action !== 'closed')") <
              fileConflicts.indexOf('await ensureConflictLabel();'),
            'file conflicts: PR gate must return before label/board writes',
          );

          const branchUniqueness = fs.readFileSync('.github/workflows/agent-branch-claim-uniqueness.yml', 'utf8');
          assert.ok(
            branchUniqueness.indexOf("if (context.eventName === 'pull_request' && context.payload.action !== 'closed')") <
              branchUniqueness.indexOf('await ensureConflictLabel();'),
            'branch uniqueness: PR gate must return before label/status writes',
          );

          const registry = fs.readFileSync('.github/workflows/agent-claim-registry.yml', 'utf8');
          assert.match(registry, /concurrency:\s*\n\s*group:\s*agent-claim-registry\s*\n\s*cancel-in-progress:\s*false/, 'global claim registry must remain one serialized writer');
          assert.doesNotMatch(registry, /agent-claim-registry-\$\{\{/, 'issue #990 must not make the global registry PR-scoped');

          console.log('agent coordination concurrency regression: PASS');
          EOF

          node scripts/lib/test-agent-coordination-concurrency.mjs
          git diff --check
          git status --short

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/agent-branch-drift.yml \
            .github/workflows/agent-claim-hygiene.yml \
            .github/workflows/agent-file-claim-conflicts.yml \
            .github/workflows/agent-branch-claim-uniqueness.yml \
            scripts/lib/test-agent-coordination-concurrency.mjs
          git commit -m "Prevent coordination check starvation"
          git push origin HEAD:ci/issue-990-coordination-starvation-v2
