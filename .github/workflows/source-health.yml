name: Source Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  youtube-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build catalogue routes
        run: npm run catalogue
      - name: Audit YouTube sources
        run: node scripts/audit-youtube-health.mjs
