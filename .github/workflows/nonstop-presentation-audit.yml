name: Audit Nonstop Presentation

on:
  push:
    branches:
      - codex/garba-nonstop-presentation-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report continuous release collisions
        run: node scripts/lib/report-continuous-release-variants.mjs
