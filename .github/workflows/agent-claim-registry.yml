name: Agent claim registry

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, reopened]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-claim-registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile agent claims
        uses: actions/github-script@v7
        env:
          BOARD_ISSUE: "364"
          LEGACY_PR_MAX: "378"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const boardIssue = Number(process.env.BOARD_ISSUE);
            const legacyPrMax = Number(process.env.LEGACY_PR_MAX);

            const claimRe = /<!--\s*agent-claim\s*\n([\s\S]*?)-->/i;
            const releaseRe = /<!--\s*agent-release\s*\n([\s\S]*?)-->/i;
            const overrideRe = /<!--\s*agent-claim-override\s*\n([\s\S]*?)-->/i;

            const labels = {
              'agent:claimed': {
                color: '1F883D',
                description: 'An implementation lane is actively owned by an agent claim.',
              },
              'agent:conflict': {
                color: 'D1242F',
                description: 'A later agent claim conflicts with the active owner.',
              },
            };

            function field(block, name) {
              const match = block.match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'mi'));
              return match ? match[1].trim() : '';
            }

            function parseEvent(comment) {
              const body = comment.body || '';
              const override = body.match(overrideRe);
              if (override) {
                return {
                  type: 'override',
                  reason: field(override[1], 'reason'),
                  author: comment.user?.login || 'unknown',
                  commentId: comment.id,
                };
              }

              const release = body.match(releaseRe);
              if (release) {
                return {
                  type: 'release',
                  agent: field(release[1], 'agent'),
                  branch: field(release[1], 'branch'),
                  author: comment.user?.login || 'unknown',
                  commentId: comment.id,
                };
              }

              const claim = body.match(claimRe);
              if (claim) {
                return {
                  type: 'claim',
                  agent: field(claim[1], 'agent'),
                  branch: field(claim[1], 'branch'),
                  scope: field(claim[1], 'scope'),
                  files: field(claim[1], 'files'),
                  author: comment.user?.login || 'unknown',
                  commentId: comment.id,
                };
              }

              return null;
            }

            function validClaim(event) {
              return event?.type === 'claim' && event.agent && event.branch && event.scope && event.files;
            }

            function sameOwner(a, b) {
              return Boolean(a && b && a.agent === b.agent && a.branch === b.branch);
            }

            function deriveState(comments) {
              let active = null;
              let conflicts = [];

              for (const comment of [...comments].sort((a, b) => a.id - b.id)) {
                const event = parseEvent(comment);
                if (!event) continue;

                if (event.type === 'override') {
                  if (event.author === owner) {
                    active = null;
                    conflicts = [];
                  }
                  continue;
                }

                if (event.type === 'release') {
                  if (active && sameOwner(active, event)) {
                    active = null;
                    conflicts = [];
                  }
                  continue;
                }

                if (!validClaim(event)) continue;

                if (!active) {
                  active = event;
                  conflicts = [];
                } else if (sameOwner(active, event)) {
                  active = event;
                } else {
                  conflicts.push(event);
                }
              }

              return { active, conflicts };
            }

            function eventMode(eventName, action) {
              if (eventName === 'workflow_dispatch') return 'full';
              if (eventName === 'issue_comment') return 'incremental';
              if (eventName === 'issues' && ['closed', 'reopened'].includes(action)) return 'incremental';
              if (eventName === 'pull_request' && ['opened', 'closed', 'reopened'].includes(action)) return 'board-only';
              return 'noop';
            }

            function assert(condition, message) {
              if (!condition) throw new Error(`Agent registry self-test failed: ${message}`);
            }

            function syntheticComment(id, body, login = 'agent') {
              return { id, body, user: { login } };
            }

            function runSelfTests() {
              const claimA = syntheticComment(1, [
                '<!-- agent-claim',
                'agent: agent/a',
                'branch: fix/a',
                'scope: scope a',
                'files: file-a',
                '-->',
              ].join('\n'));
              const claimB = syntheticComment(2, [
                '<!-- agent-claim',
                'agent: agent/b',
                'branch: fix/b',
                'scope: scope b',
                'files: file-b',
                '-->',
              ].join('\n'));
              const releaseA = syntheticComment(3, [
                '<!-- agent-release',
                'agent: agent/a',
                'branch: fix/a',
                '-->',
              ].join('\n'));
              const updatedA = syntheticComment(4, [
                '<!-- agent-claim',
                'agent: agent/a',
                'branch: fix/a',
                'scope: narrowed scope',
                'files: file-a',
                '-->',
              ].join('\n'));
              const override = syntheticComment(5, [
                '<!-- agent-claim-override',
                'reason: owner reassignment',
                '-->',
              ].join('\n'), owner);

              let state = deriveState([claimA]);
              assert(state.active?.agent === 'agent/a', 'first valid claim becomes active');

              state = deriveState([claimA, claimB]);
              assert(state.active?.agent === 'agent/a' && state.conflicts.length === 1, 'later claim conflicts');

              state = deriveState([claimA, updatedA]);
              assert(state.active?.scope === 'narrowed scope' && state.conflicts.length === 0, 'same owner can narrow claim');

              state = deriveState([claimA, claimB, releaseA]);
              assert(!state.active && state.conflicts.length === 0, 'matching release clears active claim');

              state = deriveState([claimA, override]);
              assert(!state.active, 'repository owner override clears active claim');

              assert(eventMode('issue_comment', 'created') === 'incremental', 'claim events use incremental mode');
              assert(eventMode('issues', 'closed') === 'incremental', 'issue close uses incremental mode');
              assert(eventMode('pull_request', 'opened') === 'board-only', 'PR events rebuild board only');
              assert(eventMode('workflow_dispatch', '') === 'full', 'manual recovery retains full reconciliation');
            }

            async function listComments(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            function issueLabelNames(issue) {
              return new Set((issue.labels || [])
                .map(label => typeof label === 'string' ? label : label?.name)
                .filter(Boolean));
            }

            function writeIssueLabelNames(issue, names) {
              issue.labels = [...names].map(name => ({ name }));
            }

            async function ensureLabel(name) {
              const spec = labels[name];
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, ...spec });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            async function addLabelIfNeeded(issue, name) {
              const current = issueLabelNames(issue);
              if (current.has(name)) return;

              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [name],
                });
              } catch (error) {
                if (![404, 422].includes(error.status)) throw error;
                await ensureLabel(name);
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [name],
                });
              }

              current.add(name);
              writeIssueLabelNames(issue, current);
            }

            async function removeLabelIfPresent(issue, name) {
              const current = issueLabelNames(issue);
              if (!current.has(name)) return;

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              current.delete(name);
              writeIssueLabelNames(issue, current);
            }

            function statusBody(issueNumber, state) {
              if (!state.active) {
                return [
                  '<!-- agent-coordination-status -->',
                  '### Agent coordination',
                  '',
                  '**Status:** Available',
                  '',
                  `No active claim currently owns #${issueNumber}.`,
                ].join('\n');
              }

              return [
                '<!-- agent-coordination-status -->',
                '### Agent coordination',
                '',
                '**Status:** Claimed',
                `**Agent:** \`${state.active.agent}\``,
                `**Branch:** \`${state.active.branch}\``,
                `**Scope:** ${state.active.scope}`,
                `**Files:** ${state.active.files}`,
                state.conflicts.length
                  ? `**Conflicts:** ${state.conflicts.length} later claim(s) rejected until release.`
                  : '**Conflicts:** None',
                '',
                `Claim event: comment ${state.active.commentId}.`,
              ].join('\n');
            }

            async function upsertStatus(issueNumber, comments, state) {
              const wanted = statusBody(issueNumber, state);
              const existing = comments.find(comment =>
                comment.body?.includes('<!-- agent-coordination-status -->') && comment.user?.type === 'Bot'
              );

              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: wanted });
                return;
              }

              if ((existing.body || '').trim() !== wanted.trim()) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: wanted });
              }
            }

            async function reconcileIssue(issue, knownComments = null) {
              if (!issue || issue.pull_request || issue.number === boardIssue) return null;

              const comments = knownComments || await listComments(issue.number);
              const state = deriveState(comments);
              const shouldClaim = issue.state === 'open' && Boolean(state.active);
              const shouldConflict = shouldClaim && state.conflicts.length > 0;

              if (shouldClaim) await addLabelIfNeeded(issue, 'agent:claimed');
              else await removeLabelIfPresent(issue, 'agent:claimed');

              if (shouldConflict) await addLabelIfNeeded(issue, 'agent:conflict');
              else await removeLabelIfPresent(issue, 'agent:conflict');

              if (shouldClaim) {
                await upsertStatus(issue.number, comments, state);
              } else {
                const hasStatus = comments.some(comment =>
                  comment.body?.includes('<!-- agent-coordination-status -->') && comment.user?.type === 'Bot'
                );
                if (hasStatus) await upsertStatus(issue.number, comments, { active: null, conflicts: [] });
              }

              return { issue, state };
            }

            function esc(value) {
              return String(value || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
            }

            async function updateBoard(activeRows) {
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });

              const legacyPulls = openPulls
                .filter(pr => pr.number <= legacyPrMax)
                .sort((a, b) => a.number - b.number);

              const legacy = legacyPulls.length
                ? [
                    '| PR | Existing lane |',
                    '| --- | --- |',
                    ...legacyPulls.map(pr => `| #${pr.number} | ${esc(pr.title)} |`),
                  ].join('\n')
                : '_No legacy PR lanes remain open._';

              const active = activeRows.length
                ? [
                    '| Issue | Agent | Branch | Scope | Files | Same-issue conflict |',
                    '| --- | --- | --- | --- | --- | --- |',
                    ...activeRows.map(({ issue, state }) =>
                      `| #${issue.number} | \`${esc(state.active.agent)}\` | \`${esc(state.active.branch)}\` | ${esc(state.active.scope)} | ${esc(state.active.files)} | ${state.conflicts.length ? `Yes (${state.conflicts.length})` : 'No'} |`
                    ),
                  ].join('\n')
                : '_No active machine-managed claims._';

              const board = await github.rest.issues.get({ owner, repo, issue_number: boardIssue });
              let body = board.data.body || '';

              const replacements = [
                [
                  '<!-- agent-work-board:legacy-start -->',
                  '<!-- agent-work-board:legacy-end -->',
                  legacy,
                ],
                [
                  '<!-- agent-work-board:managed-start -->',
                  '<!-- agent-work-board:managed-end -->',
                  active,
                ],
              ];

              for (const [start, end, value] of replacements) {
                const pattern = new RegExp(`${start}[\\s\\S]*?${end}`);
                if (!pattern.test(body)) {
                  throw new Error(`Board issue #${boardIssue} is missing marker ${start}.`);
                }
                body = body.replace(pattern, `${start}\n${value}\n${end}`);
              }

              if (body !== (board.data.body || '')) {
                await github.rest.issues.update({ owner, repo, issue_number: boardIssue, body });
              }
            }

            async function collectActiveRows(knownResults = new Map()) {
              const claimedIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: 'agent:claimed',
                per_page: 100,
              });

              const activeRows = [];
              const seen = new Set();

              for (const issue of claimedIssues) {
                if (issue.pull_request || issue.number === boardIssue) continue;
                seen.add(issue.number);

                const known = knownResults.get(issue.number);
                const state = known?.state || deriveState(await listComments(issue.number));
                if (state.active) activeRows.push({ issue, state });
                else core.warning(`Issue #${issue.number} still has agent:claimed but no active claim. Run workflow_dispatch if the label is stale.`);
              }

              for (const [issueNumber, result] of knownResults) {
                if (seen.has(issueNumber) || !result?.state?.active || result.issue?.state !== 'open') continue;
                activeRows.push(result);
              }

              activeRows.sort((a, b) => a.issue.number - b.issue.number);
              return activeRows;
            }

            async function updateBoardFromClaimed(knownResults = new Map()) {
              await updateBoard(await collectActiveRows(knownResults));
            }

            async function reconcileAll() {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });

              const activeRows = [];
              for (const issue of issues) {
                if (issue.pull_request || issue.number === boardIssue) continue;
                const result = await reconcileIssue(issue);
                if (result?.state.active) activeRows.push(result);
              }

              const staleClosed = new Map();
              for (const name of Object.keys(labels)) {
                const closed = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state: 'closed',
                  labels: name,
                  per_page: 100,
                });
                for (const issue of closed) {
                  if (!issue.pull_request && issue.number !== boardIssue) staleClosed.set(issue.number, issue);
                }
              }
              for (const issue of staleClosed.values()) await reconcileIssue(issue);

              activeRows.sort((a, b) => a.issue.number - b.issue.number);
              await updateBoard(activeRows);
            }

            function isRateLimitError(error) {
              if (error?.status !== 403) return false;
              const remaining = String(error?.response?.headers?.['x-ratelimit-remaining'] ?? '');
              return remaining === '0' || /rate limit/i.test(String(error?.message || ''));
            }

            async function reportDegraded(error) {
              const reset = Number(error?.response?.headers?.['x-ratelimit-reset']);
              const resetText = Number.isFinite(reset) && reset > 0
                ? ` Reset is expected around ${new Date(reset * 1000).toISOString()}.`
                : '';
              const message = `Agent claim registry degraded: GitHub API rate limit is exhausted.${resetText} Issue comment claim order remains authoritative; labels and #${boardIssue} may be stale until a workflow_dispatch recovery succeeds.`;
              core.error(message);
              await core.summary
                .addHeading('Agent claim registry degraded')
                .addRaw(message)
                .write();
              core.setFailed(message);
            }

            async function main() {
              runSelfTests();

              const action = context.payload.action || '';
              const mode = eventMode(context.eventName, action);
              if (mode === 'noop') return;

              if (mode === 'full') {
                for (const name of Object.keys(labels)) await ensureLabel(name);
                await reconcileAll();
                return;
              }

              if (context.eventName === 'issue_comment') {
                const issue = context.payload.issue;
                if (issue.pull_request || issue.number === boardIssue) return;

                const current = context.payload.comment;
                const event = parseEvent(current);
                if (!event) return;

                const comments = await listComments(issue.number);
                const beforeState = deriveState(comments.filter(comment => comment.id < current.id));

                if (event.type === 'claim') {
                  if (!validClaim(event)) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: '❌ **Claim rejected:** include non-empty `agent`, `branch`, `scope` and `files` fields.',
                    });
                  } else if (beforeState.active && !sameOwner(beforeState.active, event)) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `❌ **Claim conflict:** this lane is already owned by \`${beforeState.active.agent}\` on \`${beforeState.active.branch}\`. Do not begin overlapping implementation.`,
                    });
                  } else {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `✅ **Claim accepted:** \`${event.agent}\` owns this lane on \`${event.branch}\`.`,
                    });
                  }
                } else if (event.type === 'release') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: beforeState.active && sameOwner(beforeState.active, event)
                      ? `✅ **Release accepted:** \`${event.agent}\` / \`${event.branch}\` no longer owns this lane.`
                      : '⚠️ **Release ignored:** it does not match the active agent and branch.',
                  });
                } else if (event.type === 'override') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: event.author === owner
                      ? '✅ **Owner override accepted:** the previous claim is cleared. A new agent may claim the lane.'
                      : '❌ **Override rejected:** only the repository owner may override an active claim.',
                  });
                }

                const result = await reconcileIssue(issue, comments);
                await updateBoardFromClaimed(new Map([[issue.number, result]]));
                return;
              }

              if (context.eventName === 'issues') {
                const issue = context.payload.issue;
                if (issue.pull_request || issue.number === boardIssue) return;

                if (action === 'closed') {
                  const comments = await listComments(issue.number);
                  const state = deriveState(comments);
                  if (state.active) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: [
                        '<!-- agent-release',
                        `agent: ${state.active.agent}`,
                        `branch: ${state.active.branch}`,
                        '-->',
                        `RELEASE: issue closed; \`${state.active.agent}\` / \`${state.active.branch}\` is released automatically.`,
                      ].join('\n'),
                    });
                  }
                }

                const result = await reconcileIssue(issue);
                await updateBoardFromClaimed(new Map([[issue.number, result]]));
                return;
              }

              if (mode === 'board-only') {
                await updateBoardFromClaimed();
              }
            }

            try {
              await main();
            } catch (error) {
              if (isRateLimitError(error)) await reportDegraded(error);
              else throw error;
            }