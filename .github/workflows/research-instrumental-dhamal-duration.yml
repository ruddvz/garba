name: Research Instrumental Dhamal YouTube duration

on:
  push:
    branches:
      - research/issue-930-instrumental-dhamal-duration
    paths:
      - .github/workflows/research-instrumental-dhamal-duration.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current yt-dlp
        run: python -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp
      - name: Probe exact public watch IDs without downloading media
        shell: bash
        run: |
          set -u
          failures=0
          probe() {
            local issue="$1"
            local label="$2"
            local id="$3"
            local expected="$4"
            local out="/tmp/${id}.json"
            local err="/tmp/${id}.err"
            echo "=== ${issue} :: ${label} :: ${id} :: expected_duration=${expected}s ==="
            if python -m yt_dlp --skip-download --dump-single-json --no-warnings --no-playlist "https://www.youtube.com/watch?v=${id}" >"${out}" 2>"${err}"; then
              jq '{id,title,channel:(.channel // .uploader),channel_id:(.channel_id // .uploader_id),duration,duration_string,availability,webpage_url,extractor}' "${out}"
              actual="$(jq -r '.duration // ""' "${out}")"
              if [ "${actual}" = "${expected}" ]; then
                echo "DURATION_MATCH ${expected}s"
              else
                echo "DURATION_MISMATCH expected=${expected} actual=${actual:-missing}"
                failures=$((failures + 1))
              fi
            else
              status=$?
              echo "PROBE_BLOCKED_OR_UNAVAILABLE exit=${status}"
              sed -n '1,12p' "${err}"
              failures=$((failures + 1))
            fi
            echo
          }
          probe '#892' 'Mahisagar (Gujarati Folk) (Instrumental)' 'Hq5VhXVlE0o' '219'
          probe '#899' 'Jai Aadhya Shakti (Aarti) (Instrumental)' 'ir_yjC3vTHg' '213'
          if [ "${failures}" -ne 0 ]; then
            echo "One or more exact-duration probes were blocked, unavailable, or mismatched. Fail closed."
            exit 1
          fi
