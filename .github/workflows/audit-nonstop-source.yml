name: Audit Nonstop Source of Truth

on:
  push:
    branches:
      - codex/garba-nonstop-source-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare legacy Nonstop data to discovery sets
        run: node scripts/lib/audit-nonstop-source-of-truth.mjs
