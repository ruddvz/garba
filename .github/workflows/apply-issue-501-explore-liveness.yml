name: Apply issue 501 Explore liveness fix

on:
  push:
    branches:
      - fix/explore-artist-observer-lock-501

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explore-artist-observer-lock-501
          fetch-depth: 0

      - name: Apply bounded observer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          library_path = Path('src/catalogue/listening-library.js')
          library = library_path.read_text()

          old_artist = """      const artistId = artistIdFromCollection(card.dataset.collectionId);\n      if (!artistId) return;\n      const artist = artistById.get(artistId);"""
          new_artist = """      const artistId = artistIdFromCollection(card.dataset.collectionId);\n      if (!artistId) return;\n      if (card.dataset.artistIdentityDecorated === artistId) return;\n      card.dataset.artistIdentityDecorated = artistId;\n      const artist = artistById.get(artistId);"""
          if old_artist not in library:
              raise SystemExit('Artist decoration insertion point not found')
          library = library.replace(old_artist, new_artist, 1)

          old_observer = "new MutationObserver(queueArtistIdentity).observe(sections, { childList: true, subtree: true });"
          new_observer = "new MutationObserver(queueArtistIdentity).observe(sections, { childList: true, subtree: false });"
          if old_observer not in library:
              raise SystemExit('Self-observing artist MutationObserver not found')
          library = library.replace(old_observer, new_observer, 1)
          library_path.write_text(library)

          validator_path = Path('scripts/lib/validate-listening-flow.mjs')
          validator = validator_path.read_text()
          marker = "requireMarker(library, \"openMyGarba.href = '../?library=my-garba';\", 'Explore must expose a low-clutter My Garba entry point');\n"
          addition = marker + "requireMarker(library, \"if (card.dataset.artistIdentityDecorated === artistId) return;\", 'Explore artist identity decoration must be idempotent');\nrequireMarker(library, \"observe(sections, { childList: true, subtree: false });\", 'Explore artist observer must watch top-level catalogue rerenders only');\nif (library.includes(\"new MutationObserver(queueArtistIdentity).observe(sections, { childList: true, subtree: true });\")) { console.error('✗ Explore artist observer must not observe mutations created by its own decorator'); failed = true; }\n"
          if marker not in validator:
              raise SystemExit('Listening-flow validator insertion point not found')
          validator = validator.replace(marker, addition, 1)
          validator_path.write_text(validator)

          workflow = Path('.github/workflows/apply-issue-501-explore-liveness.yml')
          workflow.unlink()
          PY

      - name: Validate bounded fix
        run: |
          node --check src/catalogue/listening-library.js
          node --check scripts/lib/validate-listening-flow.mjs
          node scripts/lib/validate-listening-flow.mjs

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/catalogue/listening-library.js scripts/lib/validate-listening-flow.mjs .github/workflows/apply-issue-501-explore-liveness.yml
          git commit -m 'Fix Explore artist observer render lock'
          git push origin HEAD:fix/explore-artist-observer-lock-501
