name: Temporary public OG cleanup

on:
  push:
    branches: [codex/website-og-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/website-og-cleanup
      - name: Normalize OG image cache-busters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r'(?:\?v=20260908-2){2,}')
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text()
              updated = pattern.sub('?v=20260908-2', text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          validator = Path('.github/workflows/website-validate.yml')
          text = validator.read_text()
          guard = """
          if grep -R -n -E 'garba-og-card\\.png\\?v=[^\" ]+\\?v=' --include='*.html' .; then
            echo 'Duplicated OG image cache-buster found in public HTML.'
            exit 1
          fi
"""
          marker = "          grep -q 'garba-og-card.png?v=20260908-2' faq/index.html\n"
          if 'Duplicated OG image cache-buster found' not in text:
              if marker not in text:
                  raise SystemExit('website validator OG marker not found')
              text = text.replace(marker, marker + guard, 1)
              validator.write_text(text)
              changed.append(str(validator))

          print('updated:', ', '.join(changed) if changed else 'nothing')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' .github/workflows/website-validate.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No OG cleanup changes required.'
            exit 0
          fi
          git commit -m 'Normalize public OG image cache-busters'
          git push origin HEAD:codex/website-og-cleanup
