name: Apply issue 550 Govaliyo playback patch

on:
  push:
    branches:
      - youtube/issue-550-govaliyo-current-main
    paths:
      - .github/workflows/apply-issue-550-govaliyo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: youtube/issue-550-govaliyo-current-main
      - name: Add only the five verified Govaliyo 2025 routes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/playback-sources-ranked-fallbacks.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const releaseId = 'atul-govaliyo-live-uwb-vol1-2025';
          const routes = {
            'atul-govaliyo-2025-02': ['EdA1Qhh5zJY', 2],
            'atul-govaliyo-2025-04': ['pcEQGvkzmek', 4],
            'atul-govaliyo-2025-07': ['NOJKFs2mSts', 7],
            'atul-govaliyo-2025-09': ['tR9n6rkFfZA', 9],
            'atul-govaliyo-2025-10': ['BnUgRGxH2sw', 10],
          };
          for (const [songId, [videoId, trackNumber]] of Object.entries(routes)) {
            if (manifest.songSources[songId]) {
              throw new Error(`Refusing to overwrite existing playback route for ${songId}`);
            }
            manifest.songSources[songId] = {
              provider: 'youtube',
              videoId,
              startSeconds: 0,
              sourceUrl: `https://www.youtube.com/watch?v=${videoId}`,
              sourceType: 'official-artist-channel',
              releaseId,
              trackNumber,
              evidenceType: 'official-youtube-auto-generated-track',
            };
          }
          manifest.version = '0.19.0';
          manifest.updated = '2026-09-09';
          const addition = ' Issue #550 adds five independently verified auto-generated Atul Purohit Official tracks from the 2025 Govaliyo Vol. 1 release; the other five canonical Govaliyo rows remain fail-closed.';
          if (!manifest.note.includes('Issue #550')) manifest.note += addition;
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Verify exact bounded identities
        run: |
          node <<'NODE'
          const m = require('./data/playback-sources-ranked-fallbacks.json');
          const expected = {
            'atul-govaliyo-2025-02':'EdA1Qhh5zJY',
            'atul-govaliyo-2025-04':'pcEQGvkzmek',
            'atul-govaliyo-2025-07':'NOJKFs2mSts',
            'atul-govaliyo-2025-09':'tR9n6rkFfZA',
            'atul-govaliyo-2025-10':'BnUgRGxH2sw',
          };
          for (const [id, videoId] of Object.entries(expected)) {
            const route = m.songSources[id];
            if (!route || route.provider !== 'youtube' || route.videoId !== videoId || route.startSeconds !== 0) {
              throw new Error(`Incorrect route for ${id}`);
            }
          }
          for (const id of ['atul-govaliyo-2025-01','atul-govaliyo-2025-03','atul-govaliyo-2025-05','atul-govaliyo-2025-06','atul-govaliyo-2025-08']) {
            if (m.songSources[id]?.provider === 'youtube') throw new Error(`Unverified Govaliyo route must remain fail-closed: ${id}`);
          }
          NODE
      - name: Remove temporary patch workflow and commit final one-file change
        run: |
          git rm .github/workflows/apply-issue-550-govaliyo.yml
          git add data/playback-sources-ranked-fallbacks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add five exact Govaliyo 2025 YouTube routes (#550)'
          git push origin HEAD:youtube/issue-550-govaliyo-current-main
