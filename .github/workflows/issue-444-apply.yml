name: Issue 444 shared search integration

on:
  push:
    branches:
      - search/issue-444-shared-search-integration

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: search/issue-444-shared-search-integration

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply guarded shared-search integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded replacement, found {count}')
              file.write_text(text.replace(old, new, 1))

          # Player imports the shared Unicode-safe normalization/ranking contract.
          replace_once(
              'app.js',
              "import './assets/runtime/route-readiness.js';\nconst { routeReadiness, canExecuteSong } = window.GARBA_ROUTE_READINESS;",
              "import './assets/runtime/route-readiness.js';\nimport { normalizeSearchText, rankSearchRecords } from './assets/runtime/search-core.js';\nconst { routeReadiness, canExecuteSong } = window.GARBA_ROUTE_READINESS;",
          )

          old_player_search = r'''function getSheetSongs() {
            const query = els.searchInput.value.trim().toLowerCase();
            let songs;

            if (state.sheetMode === 'favourites') {
              songs = state.songs.filter((song) => state.favourites.has(song.id));
            } else if (state.sheetMode === 'queue') {
              songs = getUpNextSongs();
            } else if (state.sheetMode === 'search') {
              if (!query) {
                state.sheetMatchCount = state.songs.length;
                return [];
              }
              songs = state.songs;
            } else {
              songs = state.songs.filter((song) => song.genre === state.sheetFilter);
            }

            if (query) songs = songs.filter((song) => [
              song.title,
              song.artist,
              song.genre,
              song.category,
              ...(song.styles || []),
              ...(song.taxonomyStyles || []),
            ].filter(Boolean).join(' ').toLowerCase().includes(query));
            state.sheetMatchCount = songs.length;
            if (state.sheetMode === 'search' && songs.length > SEARCH_RESULT_LIMIT) return songs.slice(0, SEARCH_RESULT_LIMIT);
            return songs;
          }'''
          new_player_search = r'''function playerSearchRecord(song) {
            return {
              id: song.id,
              title: [song.title, song.displayTitle].filter(Boolean),
              titleAliases: song.aliases,
              artist: song.artist,
              artistAliases: song.artistAliases,
              taxonomyTerms: [
                song.genre,
                song.category,
                ...(song.styles || []),
                ...(song.taxonomyStyles || []),
              ],
              song,
            };
          }

          function rankPlayerSongs(songs, query) {
            return rankSearchRecords(songs.map(playerSearchRecord), query)
              .map(({ record }) => record.song);
          }

          function getSheetSongs() {
            const rawQuery = els.searchInput.value.trim();
            const query = normalizeSearchText(rawQuery);
            let songs;

            if (state.sheetMode === 'favourites') {
              songs = state.songs.filter((song) => state.favourites.has(song.id));
            } else if (state.sheetMode === 'queue') {
              songs = getUpNextSongs();
            } else if (state.sheetMode === 'search') {
              if (!query) {
                state.sheetMatchCount = state.songs.length;
                return [];
              }
              songs = state.songs;
            } else {
              songs = state.songs.filter((song) => song.genre === state.sheetFilter);
            }

            if (query) songs = rankPlayerSongs(songs, rawQuery);
            state.sheetMatchCount = songs.length;
            if (state.sheetMode === 'search' && songs.length > SEARCH_RESULT_LIMIT) return songs.slice(0, SEARCH_RESULT_LIMIT);
            return songs;
          }'''
          replace_once('app.js', old_player_search, new_player_search)

          # Explore is already a module; consume the same core directly.
          replace_once(
              'src/catalogue/catalogue.js',
              "const paths = {",
              "import { normalizeSearchText, rankSearchRecords } from '../../assets/runtime/search-core.js';\n\nconst paths = {",
          )

          old_explore_search = r'''function searchCatalogue(query, { updateHistory = true } = {}) {
            const q = normalise(query);
            if (!q) {
              if (updateHistory && history.state?.search) history.back();
              else closeCollection({ updateHash: updateHistory });
              return;
            }
            const terms = q.split(/\s+/).filter(Boolean);
            const songs = state.songs.filter((song)=>{
              const release = state.releaseById.get(song.releaseId);
              const text = allSongText(song,release);
              return terms.every((term)=>text.includes(term));
            });
            if (state.active?.id !== 'search') state.returnFocusTarget = searchReturnControl();
            state.active = { id:'search', title:`Search: ${query.trim()}`, kicker:'Search results', description:'Matching songs, artists, aliases, descriptions and release metadata from the PlayGarba catalogue.', songs };
            state.activeSongs = songs;
            state.activeReleaseId = null;
            syncBackLabel();
            els.home.hidden = true;
            els.detail.hidden = false;
            els.detailKicker.textContent = 'Search results';
            els.detailTitle.textContent = query.trim();
            els.detailDescription.textContent = 'Matching songs, artists, aliases, descriptions and albums from the PlayGarba catalogue.';
            document.title = `Search “${query.trim()}” · PlayGarba`;
            syncShareLabel(`search results for ${query.trim()}`);
            replaceDetailMeta([`${songs.length.toLocaleString()} matches`]);
            renderReleases(songs);
            renderSongs(songs,'Matching songs');
            if (updateHistory) {
              const nextUrl = `#search=${encodeURIComponent(query.trim())}`;
              if (history.state?.search) history.replaceState({search:q},'',nextUrl);
              else history.pushState({search:q},'',nextUrl);
            }
          }'''
          new_explore_search = r'''function exploreSearchRecord(song) {
            const release = state.releaseById.get(song.releaseId);
            return {
              id: song.id,
              title: [song.title, song.displayTitle].filter(Boolean),
              titleAliases: song.aliases,
              artist: song.artist,
              artistAliases: song.artistAliases,
              taxonomyTerms: [
                song.genre,
                song.category,
                ...(song.styles || []),
                ...(song.taxonomyStyles || []),
              ],
              releaseTerms: [
                release?.title,
                release?.displayTitle,
                ...aliasesFor(release),
                release?.artist,
                release?.label,
              ],
              song,
            };
          }

          function rankExploreSongs(songs, query) {
            return rankSearchRecords(songs.map(exploreSearchRecord), query)
              .map(({ record }) => record.song);
          }

          function searchCatalogue(query, { updateHistory = true } = {}) {
            const q = normalizeSearchText(query);
            if (!q) {
              if (updateHistory && history.state?.search) history.back();
              else closeCollection({ updateHash: updateHistory });
              return;
            }
            const songs = rankExploreSongs(state.songs, query);
            if (state.active?.id !== 'search') state.returnFocusTarget = searchReturnControl();
            state.active = { id:'search', title:`Search: ${query.trim()}`, kicker:'Search results', description:'Matching songs, artists, reviewed aliases, styles and releases from the PlayGarba catalogue.', songs };
            state.activeSongs = songs;
            state.activeReleaseId = null;
            syncBackLabel();
            els.home.hidden = true;
            els.detail.hidden = false;
            els.detailKicker.textContent = 'Search results';
            els.detailTitle.textContent = query.trim();
            els.detailDescription.textContent = 'Matching songs, artists, reviewed aliases, styles and releases from the PlayGarba catalogue.';
            document.title = `Search “${query.trim()}” · PlayGarba`;
            syncShareLabel(`search results for ${query.trim()}`);
            replaceDetailMeta([`${songs.length.toLocaleString()} matches`]);
            renderReleases(songs);
            renderSongs(songs,'Matching songs');
            if (updateHistory) {
              const nextUrl = `#search=${encodeURIComponent(query.trim())}`;
              if (history.state?.search) history.replaceState({search:q},'',nextUrl);
              else history.pushState({search:q},'',nextUrl);
            }
          }'''
          replace_once('src/catalogue/catalogue.js', old_explore_search, new_explore_search)

          # Focused player-sheet regression checks. Keep the existing startup simulation intact.
          replace_once(
              'scripts/lib/validate-sheet-startup.mjs',
              "import fs from 'node:fs';\n",
              "import fs from 'node:fs';\nimport { normalizeSearchText, rankSearchRecords } from '../../assets/runtime/search-core.js';\n",
          )

          player_assertions = r'''
          assert.match(app, /import \{ normalizeSearchText, rankSearchRecords \} from '\.\/assets\/runtime\/search-core\.js';/, 'Player search must consume the shared search core');
          assert.match(app, /function playerSearchRecord\(song\)[\s\S]*?titleAliases: song\.aliases[\s\S]*?artistAliases: song\.artistAliases[\s\S]*?taxonomyTerms:/, 'Player search adapter must expose only reviewed catalogue identity fields');
          assert.match(app, /function rankPlayerSongs\(songs, query\)[\s\S]*?rankSearchRecords\(songs\.map\(playerSearchRecord\), query\)/, 'Player results must use shared relevance ranking');
          assert.match(app, /const rawQuery = els\.searchInput\.value\.trim\(\);[\s\S]*?const query = normalizeSearchText\(rawQuery\);/, 'Player empty-query handling must use shared Unicode normalization');
          assert.doesNotMatch(app, /function getSheetSongs\(\)[\s\S]*?\.toLowerCase\(\)\.includes\(query\)/, 'Player search must not regress to independent lowercase substring matching');

          const adapterFixture = [
            { id: 'broad-taxonomy', title: 'Another Garba', artist: 'Singer', genre: 'folk', category: 'maa' },
            { id: 'exact-title', title: 'Maa', artist: 'Singer', genre: 'traditional', category: 'garba' },
            { id: 'gujarati-title', title: 'માડી તારું કંકુ ખર્યું', artist: 'Singer', genre: 'traditional', category: 'garba' },
          ];
          const adapterRecord = (song) => ({
            id: song.id,
            title: [song.title, song.displayTitle].filter(Boolean),
            titleAliases: song.aliases,
            artist: song.artist,
            artistAliases: song.artistAliases,
            taxonomyTerms: [song.genre, song.category, ...(song.styles || []), ...(song.taxonomyStyles || [])],
            song,
          });
          assert.equal(normalizeSearchText('  Maa!!!  '), 'maa', 'Shared normalization must collapse punctuation and spacing for player input');
          assert.deepEqual(
            rankSearchRecords(adapterFixture.map(adapterRecord), 'maa').map(({ record }) => record.song.id),
            ['exact-title', 'broad-taxonomy'],
            'Exact title must rank above a broad taxonomy match through the player adapter',
          );
          assert.equal(
            rankSearchRecords(adapterFixture.map(adapterRecord), 'માડી તારું').at(0)?.record.song.id,
            'gujarati-title',
            'Gujarati script must survive the player adapter and shared normalization',
          );
          '''
          replace_once(
              'scripts/lib/validate-sheet-startup.mjs',
              "// 2. Behavioral simulation of player startup, sheet opening, closing, and catalogue refresh",
              player_assertions.strip() + "\n\n// 2. Behavioral simulation of player startup, sheet opening, closing, and catalogue refresh",
          )

          # Explore regression checks prove the same search core owns normalization/ranking.
          explore_assertions = r'''
          for (const marker of [
            "import { normalizeSearchText, rankSearchRecords } from '../../assets/runtime/search-core.js';",
            'function exploreSearchRecord(song)',
            'titleAliases: song.aliases',
            'artistAliases: song.artistAliases',
            'function rankExploreSongs(songs, query)',
            'rankSearchRecords(songs.map(exploreSearchRecord), query)',
            'const q = normalizeSearchText(query);',
            'const songs = rankExploreSongs(state.songs, query);',
            'Matching songs, artists, reviewed aliases, styles and releases from the PlayGarba catalogue.',
          ]) {
            if (!catalogue.includes(marker)) fail(`Explore shared-search integration is missing: ${marker}`);
          }
          if (/function searchCatalogue\(query[\s\S]*?terms\.every\(\(term\)=>text\.includes\(term\)\)/.test(catalogue)) {
            fail('Explore search must not regress to its independent term-substring matcher');
          }
          '''
          replace_once(
              'scripts/lib/validate-explore-detail-refinement.mjs',
              "for (const marker of [\n  'function replaceDetailMeta(values = [])',",
              explore_assertions.strip() + "\n\nfor (const marker of [\n  'function replaceDetailMeta(values = [])',",
          )

          # This workflow is an editing transport only. It must not survive in the PR diff.
          Path('.github/workflows/issue-444-apply.yml').unlink()
          PY

      - name: Focused syntax and search checks
        run: |
          node --input-type=module --check < app.js
          node --check src/catalogue/catalogue.js
          node scripts/lib/test-search-core.mjs
          node scripts/lib/validate-sheet-startup.mjs
          node scripts/lib/validate-explore-detail-refinement.mjs

      - name: Commit exact owned files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js src/catalogue/catalogue.js scripts/lib/validate-sheet-startup.mjs scripts/lib/validate-explore-detail-refinement.mjs .github/workflows/issue-444-apply.yml
          git diff --cached --check
          git commit -m 'Unify player and Explore search ranking (#444)'

      - name: Full repository validation
        run: npm run check

      - name: Push verified commit
        run: git push origin HEAD:search/issue-444-shared-search-integration
