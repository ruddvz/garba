name: Apply release context 403

on:
  push:
    branches: [codex/release-context-403]
    paths:
      - '.github/workflows/apply-release-context-403.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claimed branch
        uses: actions/checkout@v4
        with:
          ref: codex/release-context-403
          fetch-depth: 0

      - name: Apply release-aware listening context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once('app.js', """  playContextGenreId: 'traditional',
            playContextSongId: null,
            playing: false,
          """, """  playContextGenreId: 'traditional',
            playContextSongId: null,
            releaseContextId: null,
            releaseContextSongId: null,
            playing: false,
          """)

          replace_once('app.js', """const songsForGenre = (genreId) => state.songs.filter((song) => song.genre === genreId);

          function persistFavourites() {
          """, """const songsForGenre = (genreId) => state.songs.filter((song) => song.genre === genreId);
          const numericTrackNumber = (song) => {
            const value = Number(song?.trackNumber);
            return Number.isFinite(value) && value > 0 ? value : null;
          };

          function orderedReleaseSongs(releaseId) {
            if (!releaseId) return [];
            const byId = new Map();
            for (const song of state.songs) {
              if (!song?.id || song.releaseId !== releaseId || numericTrackNumber(song) == null) continue;
              byId.set(song.id, song);
            }
            return [...byId.values()].sort((left, right) => {
              const trackDelta = numericTrackNumber(left) - numericTrackNumber(right);
              return trackDelta || left.id.localeCompare(right.id);
            });
          }

          function releaseContextMatch(releaseId, songId) {
            const ordered = orderedReleaseSongs(releaseId);
            if (ordered.length < 2 || !songId) return null;
            return ordered.some((song) => song.id === songId) ? { releaseId, songId, ordered } : null;
          }

          function clearReleaseContext() {
            state.releaseContextId = null;
            state.releaseContextSongId = null;
          }

          function setReleaseContext(releaseId, songId) {
            const match = releaseContextMatch(releaseId, songId);
            if (!match) {
              clearReleaseContext();
              return false;
            }
            state.releaseContextId = match.releaseId;
            state.releaseContextSongId = match.songId;
            return true;
          }

          function songBelongsToActiveRelease(song) {
            return Boolean(
              song?.id
              && state.releaseContextId
              && song.releaseId === state.releaseContextId
              && numericTrackNumber(song) != null
              && orderedReleaseSongs(state.releaseContextId).some((entry) => entry.id === song.id)
            );
          }

          function releaseContinuationSongs(limit = Infinity) {
            const match = releaseContextMatch(state.releaseContextId, state.releaseContextSongId);
            if (!match) return [];
            const index = match.ordered.findIndex((song) => song.id === state.releaseContextSongId);
            const remaining = index >= 0 ? match.ordered.slice(index + 1) : [];
            return Number.isFinite(limit) ? remaining.slice(0, Math.max(0, limit)) : remaining;
          }

          function automaticGenreContinuation(limit = 12, {
            genreId = state.playContextGenreId || state.genreId,
            anchorId = state.playContextSongId || state.songId,
            excludeIds = new Set(),
          } = {}) {
            const list = songsForGenre(genreId);
            if (!list.length || limit <= 0) return [];
            const excluded = excludeIds instanceof Set ? excludeIds : new Set(excludeIds || []);
            const anchorIndex = list.findIndex((song) => song.id === anchorId);
            const ordered = anchorIndex < 0
              ? [...list]
              : [...list.slice(anchorIndex + 1), ...list.slice(0, anchorIndex)];
            const seen = new Set();
            const result = [];
            for (const song of ordered) {
              if (!song?.id || song.id === state.songId || excluded.has(song.id) || seen.has(song.id)) continue;
              seen.add(song.id);
              result.push(song);
              if (result.length >= limit) break;
            }
            return result;
          }

          function persistFavourites() {
          """)

          replace_once('app.js', """function updateUrl() {
            const url = new URL(location.href);
            url.searchParams.set('genre', state.genreId);
            const songId = state.pendingSongId || state.songId;
            if (songId) url.searchParams.set('song', songId);
            url.searchParams.delete('browse');
            url.searchParams.delete('source');
            url.searchParams.delete('library');
            history.replaceState(history.state, '', `${url.pathname}?${url.searchParams.toString()}${url.hash}`);
          }
          """, """function updateUrl() {
            const url = new URL(location.href);
            url.searchParams.set('genre', state.genreId);
            const songId = state.pendingSongId || state.songId;
            if (songId) url.searchParams.set('song', songId);
            const song = state.songs.find((entry) => entry.id === songId) || null;
            if (
              state.releaseContextId
              && song?.releaseId === state.releaseContextId
              && numericTrackNumber(song) != null
            ) url.searchParams.set('release', state.releaseContextId);
            else url.searchParams.delete('release');
            url.searchParams.delete('browse');
            url.searchParams.delete('source');
            url.searchParams.delete('library');
            history.replaceState(history.state, '', `${url.pathname}?${url.searchParams.toString()}${url.hash}`);
          }
          """)

          replace_once('app.js', """function automaticUpNextSongs(limit = 12) {
            const genreId = state.playContextGenreId || state.genreId;
            const list = songsForGenre(genreId);
            if (!list.length) return [];
            const anchorId = state.playContextSongId || state.songId;
            const currentIndex = list.findIndex((song) => song.id === anchorId);
            if (currentIndex < 0) return list.slice(0, limit);
            return [...list.slice(currentIndex + 1), ...list.slice(0, currentIndex)].slice(0, limit);
          }
          """, """function automaticUpNextSongs(limit = 12) {
            if (state.releaseContextId) {
              const releaseSongs = orderedReleaseSongs(state.releaseContextId);
              const releaseIds = new Set(releaseSongs.map((song) => song.id));
              const remaining = releaseContinuationSongs(limit);
              if (remaining.length >= limit) return remaining;
              const anchorId = state.releaseContextSongId || state.songId;
              const anchorSong = state.songs.find((song) => song.id === anchorId) || null;
              const generic = automaticGenreContinuation(limit - remaining.length, {
                genreId: anchorSong?.genre || state.playContextGenreId || state.genreId,
                anchorId,
                excludeIds: releaseIds,
              });
              return [...remaining, ...generic].slice(0, limit);
            }
            return automaticGenreContinuation(limit);
          }
          """)

          replace_once('app.js', """  if (!options.initial) state.pendingSongId = null;

            const previousSongId = state.songId;
          """, """  if (!options.initial) state.pendingSongId = null;
            if (!options.preserveReleaseContext && !options.initial) clearReleaseContext();

            const previousSongId = state.songId;
          """)

          replace_once('app.js', """    if (!options.preserveContext) {
                state.playContextGenreId = song.genre;
                state.playContextSongId = song.id;
              }
              configureAudio(song, restoreElapsed);
          """, """    if (!options.preserveContext) {
                state.playContextGenreId = song.genre;
                state.playContextSongId = song.id;
              }
              if ((options.releaseContextAdvance || options.syncReleaseAnchor) && songBelongsToActiveRelease(song)) {
                state.releaseContextSongId = song.id;
              }
              configureAudio(song, restoreElapsed);
          """)

          replace_once('app.js', """  if (genreId === state.genreId) {
              state.sheetFilter = genreId;
              syncGenreStrips();
              return;
            }
          """, """  if (genreId === state.genreId) {
              clearReleaseContext();
              const song = currentSong();
              if (song) {
                state.playContextGenreId = song.genre;
                state.playContextSongId = song.id;
              }
              state.sheetFilter = genreId;
              syncGenreStrips();
              updateQueueBadge();
              updateUrl();
              return;
            }
          """)

          replace_once('app.js', """    copy.append(title, artist);
              copy.addEventListener('click', () => selectSong(song.id, {
                keepSheet: true,
                preserveContext: queued,
                consumeQueued: queued,
              }));
          """, """    copy.append(title, artist);
              const releaseContinuation = state.sheetMode === 'queue'
                && !queued
                && releaseContinuationSongs().some((entry) => entry.id === song.id);
              copy.addEventListener('click', () => selectSong(song.id, {
                keepSheet: true,
                preserveContext: queued || releaseContinuation,
                preserveReleaseContext: queued || releaseContinuation,
                releaseContextAdvance: releaseContinuation,
                consumeQueued: queued,
              }));
          """)

          replace_once('app.js', """function changeSong(direction) {
            if (direction < 0 && state.listeningHistory.length) {
              const previousId = state.listeningHistory.pop();
              if (previousId) {
                selectSong(previousId, { keepSheet: true, preservePlayback: true, preserveContext: true, fromHistory: true });
                return;
              }
            }

            if (direction > 0) {
              sanitiseManualQueue();
              const queuedId = state.manualQueue.shift();
              if (queuedId) {
                persistManualQueue();
                selectSong(queuedId, { keepSheet: true, preservePlayback: true, preserveContext: true });
                return;
              }
            }

            const genreId = state.playContextGenreId || state.genreId;
            const list = songsForGenre(genreId);
            if (!list.length) return;
            const anchorId = state.playContextSongId || state.songId;
            let index = list.findIndex((song) => song.id === anchorId);
            index = index < 0 ? 0 : (index + direction + list.length) % list.length;
            selectSong(list[index].id, { keepSheet: true, preservePlayback: true });
          }
          """, """function changeSong(direction) {
            if (direction < 0 && state.listeningHistory.length) {
              const previousId = state.listeningHistory.pop();
              if (previousId) {
                selectSong(previousId, {
                  keepSheet: true,
                  preservePlayback: true,
                  preserveContext: true,
                  preserveReleaseContext: true,
                  syncReleaseAnchor: true,
                  fromHistory: true,
                });
                return;
              }
            }

            if (direction > 0) {
              sanitiseManualQueue();
              const queuedId = state.manualQueue.shift();
              if (queuedId) {
                persistManualQueue();
                selectSong(queuedId, {
                  keepSheet: true,
                  preservePlayback: true,
                  preserveContext: true,
                  preserveReleaseContext: true,
                });
                return;
              }
            }

            if (direction > 0 && state.releaseContextId) {
              const nextReleaseSong = releaseContinuationSongs(1)[0];
              if (nextReleaseSong) {
                selectSong(nextReleaseSong.id, {
                  keepSheet: true,
                  preservePlayback: true,
                  preserveContext: true,
                  preserveReleaseContext: true,
                  releaseContextAdvance: true,
                });
                return;
              }

              const releaseSongs = orderedReleaseSongs(state.releaseContextId);
              const releaseIds = new Set(releaseSongs.map((song) => song.id));
              const anchorId = state.releaseContextSongId || state.songId;
              const anchorSong = state.songs.find((song) => song.id === anchorId) || null;
              const nextGeneric = automaticGenreContinuation(1, {
                genreId: anchorSong?.genre || state.playContextGenreId || state.genreId,
                anchorId,
                excludeIds: releaseIds,
              })[0];
              clearReleaseContext();
              if (nextGeneric) {
                selectSong(nextGeneric.id, { keepSheet: true, preservePlayback: true });
                return;
              }
              updateQueueBadge();
              renderSheet();
              updateUrl();
              return;
            }

            const genreId = state.playContextGenreId || state.genreId;
            const list = songsForGenre(genreId);
            if (!list.length) return;
            const anchorId = state.playContextSongId || state.songId;
            let index = list.findIndex((song) => song.id === anchorId);
            index = index < 0 ? 0 : (index + direction + list.length) % list.length;
            selectSong(list[index].id, { keepSheet: true, preservePlayback: true });
          }
          """)

          replace_once('app.js', """    state.songs = next.songs;
                state.presentationRedirects = next.presentationRedirects;
                reconcilePresentationFavourites();
          """, """    state.songs = next.songs;
                state.presentationRedirects = next.presentationRedirects;
                if (state.releaseContextId && !releaseContextMatch(state.releaseContextId, state.releaseContextSongId || state.songId)) {
                  clearReleaseContext();
                }
                reconcilePresentationFavourites();
          """)

          replace_once('app.js', """    songs: songs.map((song) => [song.id, song.title, song.artist, song.genre, song.durationSeconds, song.audioUrl, song.youtubeId]),
          """, """    songs: songs.map((song) => [song.id, song.title, song.artist, song.genre, song.releaseId, song.trackNumber, song.durationSeconds, song.audioUrl, song.youtubeId]),
          """)

          replace_once('app.js', """  let requestedSong = params.get('song');
            const requestedGenre = params.get('genre');
            const redirect = requestedSong ? state.presentationRedirects.get(requestedSong) : null;
          """, """  let requestedSong = params.get('song');
            const requestedGenre = params.get('genre');
            const requestedRelease = params.get('release');
            const redirect = requestedSong ? state.presentationRedirects.get(requestedSong) : null;
          """)

          replace_once('app.js', """  if (!song || song.genre !== genre.id) song = state.songs.find((entry) => entry.genre === genre.id) || state.songs[0];
            return {
              genre,
              song,
              pendingSongId,
              elapsed: Number(session.elapsed || 0),
          """, """  if (!song || song.genre !== genre.id) song = state.songs.find((entry) => entry.genre === genre.id) || state.songs[0];
            const releaseContext = requestedRelease
              && requestedSong
              && song?.id === requestedSong
              && !pendingNonstopSetId
              ? releaseContextMatch(requestedRelease, requestedSong)
              : null;
            return {
              genre,
              song,
              pendingSongId,
              releaseContextId: releaseContext?.releaseId || null,
              elapsed: Number(session.elapsed || 0),
          """)

          replace_once('app.js', """    if (initial.song) await selectSong(initial.song.id, { initial: true, animate: false, restoreElapsed: initial.elapsed, keepSheet: true });
              else {
                renderPlayer();
                syncGenreStrips({ smooth: false });
                renderSheet();
              }

              state.pendingSongId = initial.pendingSongId;
          """, """    if (initial.song) await selectSong(initial.song.id, { initial: true, animate: false, restoreElapsed: initial.elapsed, keepSheet: true });
              else {
                renderPlayer();
                syncGenreStrips({ smooth: false });
                renderSheet();
              }

              if (initial.releaseContextId && initial.song) {
                setReleaseContext(initial.releaseContextId, initial.song.id);
                renderPlayer();
                renderSheet();
              } else clearReleaseContext();

              state.pendingSongId = initial.pendingSongId;
          """)

          handoff = r'''

          (() => {
            const detail = document.getElementById('collectionDetail');
            const releaseRail = document.getElementById('releaseRail');
            const songList = document.getElementById('catalogueSongList');
            if (!detail || !releaseRail || !songList) return;

            let queued = false;
            let syncToken = 0;

            const releaseTrackNumberForHandoff = (song) => {
              const value = Number(song?.trackNumber);
              return Number.isFinite(value) && value > 0 ? value : null;
            };

            function selectedReleaseId() {
              if (detail.hidden) return null;
              const active = releaseRail.querySelector('.release-card.active[data-release-id]');
              return active instanceof HTMLElement ? active.dataset.releaseId || null : null;
            }

            async function syncReleaseListenHandoff() {
              queued = false;
              const releaseId = selectedReleaseId();
              const token = ++syncToken;
              const { songById } = await loadCatalogue();
              if (token !== syncToken) return;
              if (releaseId !== selectedReleaseId()) {
                queueReleaseListenHandoff();
                return;
              }

              for (const link of songList.querySelectorAll('a.play-link[href]')) {
                let destination;
                try { destination = new URL(link.href, location.href); }
                catch { continue; }
                if (destination.origin !== location.origin) continue;
                const songId = destination.searchParams.get('song');
                const song = songId ? songById.get(songId) : null;
                const validReleasePair = Boolean(
                  releaseId
                  && song?.releaseId === releaseId
                  && releaseTrackNumberForHandoff(song) != null
                );
                if (validReleasePair) destination.searchParams.set('release', releaseId);
                else destination.searchParams.delete('release');
                const nextHref = destination.toString();
                if (link.href !== nextHref) link.href = nextHref;
                if (validReleasePair) link.dataset.releaseContext = releaseId;
                else delete link.dataset.releaseContext;
              }
            }

            function queueReleaseListenHandoff() {
              if (queued) return;
              queued = true;
              queueMicrotask(() => { void syncReleaseListenHandoff(); });
            }

            new MutationObserver(queueReleaseListenHandoff).observe(songList, {
              childList: true,
              subtree: true,
            });
            new MutationObserver(queueReleaseListenHandoff).observe(releaseRail, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class'],
            });
            new MutationObserver(queueReleaseListenHandoff).observe(detail, {
              attributes: true,
              attributeFilter: ['hidden'],
            });
            window.addEventListener('popstate', queueReleaseListenHandoff);
            window.addEventListener('pageshow', queueReleaseListenHandoff);
            queueReleaseListenHandoff();
          })();
          '''

          library = Path('src/catalogue/listening-library.js')
          library_text = library.read_text()
          anchor = "\nstartWhenReady();\nwatchCatalogueRenders();\n"
          if library_text.count(anchor) != 1:
              raise SystemExit(f'listening-library.js: expected one handoff anchor, found {library_text.count(anchor)}')
          library.write_text(library_text.replace(anchor, anchor + handoff, 1))

          validator = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const app = fs.readFileSync('app.js', 'utf8');
          const listening = fs.readFileSync('src/catalogue/listening-library.js', 'utf8');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const songs = JSON.parse(fs.readFileSync('data/songs.json', 'utf8'));

          const sourceChecks = [
            [app, /releaseContextId:\s*null/, 'player keeps an explicit transient release context'],
            [app, /function orderedReleaseSongs\(releaseId\)/, 'player derives release order from catalogue songs'],
            [app, /Number\(song\?\.trackNumber\)/, 'release ordering requires numeric track numbers'],
            [app, /trackDelta \|\| left\.id\.localeCompare\(right\.id\)/, 'release ordering uses stable ID tie-breaker'],
            [app, /url\.searchParams\.set\('release', state\.releaseContextId\)/, 'valid release context is reflected in the player URL'],
            [app, /url\.searchParams\.delete\('release'\)/, 'stale release context is removed from the player URL'],
            [app, /const requestedRelease = params\.get\('release'\)/, 'player reads explicit release handoff'],
            [app, /releaseContextMatch\(requestedRelease, requestedSong\)/, 'release and song pairing is validated before activation'],
            [app, /preserveReleaseContext: true/, 'manual queue and history can preserve the underlying release context'],
            [app, /releaseContextAdvance: true/, 'automatic release traversal advances the release anchor'],
            [app, /releaseContinuationSongs\(1\)/, 'Next checks release continuation after manual queue'],
            [app, /excludeIds: releaseIds/, 'generic continuation excludes release songs after album exhaustion'],
            [listening, /function selectedReleaseId\(\)/, 'Explore detects explicit selected-release detail context'],
            [listening, /song\?\.releaseId === releaseId/, 'Explore validates canonical song/release pairing'],
            [listening, /destination\.searchParams\.set\('release', releaseId\)/, 'release-detail Listen links hand off the canonical release ID'],
            [listening, /destination\.searchParams\.delete\('release'\)/, 'broad Explore links do not retain stale release context'],
          ];
          for (const [source, pattern, message] of sourceChecks) assert.match(source, pattern, message);

          assert.equal(pkg.scripts['release:context:validate'], 'node scripts/lib/validate-release-listening-context.mjs');
          assert.match(pkg.scripts.check, /npm run release:context:validate/, 'full check must include release-context validation');
          assert.match(pkg.scripts['check:modules'], /validate-release-listening-context\.mjs/, 'module syntax check must include the validator');

          const numericTrack = (song) => {
            const value = Number(song?.trackNumber);
            return Number.isFinite(value) && value > 0 ? value : null;
          };
          const byRelease = new Map();
          for (const song of songs) {
            if (!song?.id || !song?.releaseId || numericTrack(song) == null || String(song.presentationRole || 'catalogue') !== 'catalogue') continue;
            if (!byRelease.has(song.releaseId)) byRelease.set(song.releaseId, new Map());
            byRelease.get(song.releaseId).set(song.id, song);
          }
          const candidates = [...byRelease.entries()]
            .map(([releaseId, map]) => [releaseId, [...map.values()]])
            .filter(([, entries]) => entries.length >= 3);
          assert.ok(candidates.length, 'catalogue needs at least one canonical multi-track release fixture');

          const [releaseId, entries] = candidates[0];
          const ordered = [...entries].sort((left, right) => numericTrack(left) - numericTrack(right) || left.id.localeCompare(right.id));
          assert.equal(new Set(ordered.map((song) => song.id)).size, ordered.length, 'release order must not duplicate canonical song IDs');
          for (let index = 1; index < ordered.length; index += 1) {
            const previous = ordered[index - 1];
            const current = ordered[index];
            assert.ok(
              numericTrack(previous) < numericTrack(current)
              || (numericTrack(previous) === numericTrack(current) && previous.id.localeCompare(current.id) <= 0),
              'release order must be trackNumber then stable ID'
            );
          }

          const anchor = ordered[0];
          const expectedNext = ordered[1];
          const queuedCrossRelease = songs.find((song) => song?.id && song.releaseId && song.releaseId !== releaseId && song.youtubeId);
          assert.ok(expectedNext, 'release fixture must have a next track');
          assert.equal(ordered[ordered.findIndex((song) => song.id === anchor.id) + 1].id, expectedNext.id, 'release continuation must advance after the active release track');
          if (queuedCrossRelease) {
            const releaseAnchorAfterManualQueue = anchor.id;
            assert.equal(releaseAnchorAfterManualQueue, anchor.id, 'cross-release manual queue playback must not advance the release anchor');
            assert.equal(ordered[ordered.findIndex((song) => song.id === releaseAnchorAfterManualQueue) + 1].id, expectedNext.id, 'release continuation must resume after the queue drains');
          }
          assert.equal(entries.some((song) => song.id === '__invalid-song__'), false, 'invalid release/song pair must fail closed');

          console.log(`Release listening context validated with ${candidates.length} canonical multi-track release fixtures.`);
          '''
          Path('scripts/lib/validate-release-listening-context.mjs').write_text(validator)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['release:context:validate'] = 'node scripts/lib/validate-release-listening-context.mjs'
          module_check = 'node --check scripts/lib/validate-release-listening-context.mjs'
          if module_check not in scripts['check:modules']:
              scripts['check:modules'] += ' && ' + module_check
          release_check = 'npm run release:context:validate'
          if release_check not in scripts['check']:
              anchor = 'npm run listening:flow:validate && '
              if anchor not in scripts['check']:
                  raise SystemExit('package.json: listening-flow validation anchor missing')
              scripts['check'] = scripts['check'].replace(anchor, anchor + release_check + ' && ', 1)
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Validate focused release context
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < app.js
          node --check src/catalogue/listening-library.js
          node --check scripts/lib/validate-release-listening-context.mjs
          npm run catalogue
          npm run release:context:validate

      - name: Run full repository validation
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Commit claimed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js src/catalogue/listening-library.js package.json scripts/lib/validate-release-listening-context.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No implementation changes'; exit 0; }
          git commit -m 'Add release-aware listening continuation'
          git push origin HEAD:codex/release-context-403
