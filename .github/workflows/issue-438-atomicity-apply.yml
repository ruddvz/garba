name: Issue 438 atomicity apply

on:
  push:
    branches:
      - test/issue-438-playback-atomicity
    paths:
      - '.github/workflows/issue-438-atomicity-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/issue-438-playback-atomicity
          fetch-depth: 0

      - name: Apply exact Nonstop identity guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('youtube-player-runtime.js')
          source = path.read_text()
          old = "  function reopenAfterNavigation() {\n    const next = currentSafeSong();\n"
          new = (
              "  function reopenAfterNavigation() {\n"
              "    const nonstopOwnsVisibleIdentity = $('app')?.dataset.playMode === 'nonstop'\n"
              "      && String(activeSong?.id || '').startsWith('nonstop:');\n"
              "    if (nonstopOwnsVisibleIdentity) return;\n"
              "\n"
              "    const next = currentSafeSong();\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one navigation observer anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validate bounded change
        run: |
          node --check youtube-player-runtime.js
          git diff --check
          git diff -- youtube-player-runtime.js
          grep -F 'nonstopOwnsVisibleIdentity' youtube-player-runtime.js
          grep -F "startsWith('nonstop:')" youtube-player-runtime.js

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue-438-atomicity-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube-player-runtime.js .github/workflows/issue-438-atomicity-apply.yml
          git diff --cached --check
          git commit -m 'fix(player): preserve Nonstop selection during title sync'
          git push origin HEAD:test/issue-438-playback-atomicity
