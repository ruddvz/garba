name: Validate GARBA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Install social renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp fonts-gfs-didot icoutils
      - name: Render PWA icons
        run: |
          mkdir -p /tmp/playgarba-icons
          rsvg-convert -w 192 -h 192 assets/icons/icon.svg -o /tmp/playgarba-icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/icons/icon.svg -o /tmp/playgarba-icons/icon-512.png
          rsvg-convert -w 192 -h 192 assets/icons/maskable.svg -o /tmp/playgarba-icons/maskable-192.png
          rsvg-convert -w 512 -h 512 assets/icons/maskable.svg -o /tmp/playgarba-icons/maskable-512.png
          file /tmp/playgarba-icons/icon-192.png | grep -q 'PNG image data, 192 x 192'
          file /tmp/playgarba-icons/icon-512.png | grep -q 'PNG image data, 512 x 512'
          file /tmp/playgarba-icons/maskable-192.png | grep -q 'PNG image data, 192 x 192'
          file /tmp/playgarba-icons/maskable-512.png | grep -q 'PNG image data, 512 x 512'
      - name: Render social preview
        run: |
          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi
          test -n "$PACK"

          mkdir -p /tmp/playgarba-social
          unzip -p "$PACK" 04-colourful-garba-courtyard-a.webp > /tmp/playgarba-social/og-background.webp
          dwebp /tmp/playgarba-social/og-background.webp -quiet -o /tmp/playgarba-social/og-background.png
          cp assets/social/playgarba-og-card.svg /tmp/playgarba-social/playgarba-og-card.svg
          (
            cd /tmp/playgarba-social
            rsvg-convert -w 1200 -h 630 playgarba-og-card.svg -o garba-og-card.png
          )
          file /tmp/playgarba-social/garba-og-card.png | grep -q 'PNG image data, 1200 x 630'

      # Temporary issue #450 measurement runner. This block is removed after the
      # baseline artifact is collected; it is not part of the final PR contract.
      - name: Install Chromium performance runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare production-equivalent performance fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _perf
          mkdir -p _perf/explore

          cp \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _perf/
          cp -R assets data _perf/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _perf/explore/

          cat app.js assets/runtime/seek-state.js > _perf/app.js
          grep -q 'GARBA_SEEK_STATE_RUNTIME' _perf/app.js

          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _perf/styles.css
          ! grep -q '@import' _perf/styles.css

          mkdir -p _perf/assets/icons
          rsvg-convert -w 16 -h 16 assets/icons/icon.svg -o _perf/assets/icons/favicon-16.png
          rsvg-convert -w 32 -h 32 assets/icons/icon.svg -o _perf/assets/icons/favicon-32.png
          rsvg-convert -w 48 -h 48 assets/icons/icon.svg -o _perf/assets/icons/favicon-48.png
          icotool -c -o _perf/favicon.ico \
            _perf/assets/icons/favicon-16.png \
            _perf/assets/icons/favicon-32.png \
            _perf/assets/icons/favicon-48.png

          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi
          test -n "$PACK"

          rm -rf _perf/assets/backgrounds/library
          mkdir -p _perf/assets/backgrounds/library
          unzip -oq "$PACK" -d _perf/assets/backgrounds/library
          test "$(find _perf/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 15
          rm -f _perf/assets/backgrounds/garba15-*.zip

      - name: Measure final cache-aware seven-run baseline
        shell: bash
        env:
          PLAYGARBA_TESTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYGARBA_PERF_FIXTURE: production-equivalent-ci
        run: |
          set -euo pipefail
          mkdir -p /tmp/playgarba-performance
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _perf >/tmp/playgarba-performance/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          node scripts/performance/measure-player.mjs \
            --origin=http://127.0.0.1:4173 \
            --runs=7 \
            --output=/tmp/playgarba-performance/player-baseline.json \
            >/tmp/playgarba-performance/stdout.json \
            2>/tmp/playgarba-performance/stderr.log

          BASELINE=/tmp/playgarba-performance/player-baseline.json
          jq -e '.schemaVersion == 3 and .runsPerProfile == 7 and (.profiles | length == 2)' "$BASELINE" >/dev/null
          jq -e '[.profiles[].cold[], .profiles[].warm[]] | all(.failures | length == 0)' "$BASELINE" >/dev/null
          jq -e '[.profiles[].cold[], .profiles[].warm[]] | all(.searchMatchedQuery == true and .searchResultCount > 0 and .nonstopSetCount > 0 and (.nonstopPresentationMs | type == "number"))' "$BASELINE" >/dev/null
          jq -e '[.profiles[].warm[]] | all(.songsTransferBytes <= 1000)' "$BASELINE" >/dev/null

      - name: Upload player performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-450-player-performance-baseline
          path: /tmp/playgarba-performance/
          if-no-files-found: warn
          retention-days: 7
