name: Audit issue 462 Parth release

on:
  push:
    branches:
      - codex/parth-nonstop-release-audit-462

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/parth-nonstop-release-audit-462
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve canonical Parth release and backfill exact taxonomy
        run: python3 .github/scripts/audit-issue-462-parth-release.py
      - name: Validate repository
        run: npm run check
      - name: Commit source-truthful metadata repair and remove temporary audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/sets/sets-04.json
          git rm .github/workflows/audit-issue-462-parth-release.yml .github/scripts/audit-issue-462-parth-release.py
          git commit -m "Verify Parth Nonstop release taxonomy"
          git push origin HEAD:codex/parth-nonstop-release-audit-462
