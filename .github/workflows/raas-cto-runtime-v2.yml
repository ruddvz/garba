name: RAAS CTO runtime v2

on:
  pull_request:
    paths:
      - 'scripts/lib/raas-cto-runtime.mjs'
      - 'scripts/lib/raas-cto-runtime.test.mjs'
      - 'scripts/raas-adaptive.mjs'
      - '.raas/adaptive-cto.json'
      - '.github/workflows/raas-cto-runtime-v2.yml'

permissions:
  contents: write

jobs:
  runtime-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge current v1 dependency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/raas-adaptive-cto-v1
          git merge --no-edit origin/codex/raas-adaptive-cto-v1

      - name: Verify both adaptive layers
        run: |
          node --check scripts/raas-adaptive.mjs
          node --check scripts/lib/raas-cto-runtime.mjs
          node scripts/raas-adaptive.test.mjs
          node scripts/lib/raas-cto-runtime.test.mjs

      - name: Push dependency reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.head_ref }}
