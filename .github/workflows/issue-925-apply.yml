name: Issue 925 apply fullscreen control

on:
  push:
    branches:
      - pwa/issue-925-fullscreen-control

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pwa/issue-925-fullscreen-control
          fetch-depth: 0

      - name: Apply guarded fullscreen integration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text()

          favourite_anchor = '          <button class="icon-button desktop-only" id="favouritesButton" type="button" aria-label="Open My Garba" title="My Garba">\n'
          if index.count(favourite_anchor) != 1:
              raise SystemExit('expected exactly one favourites utility anchor')

          fullscreen_button = (
              '          <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false" hidden>\n'
              '            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreenIconPath" d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"></path></svg>\n'
              '          </button>\n'
          )
          index = index.replace(favourite_anchor, fullscreen_button + favourite_anchor, 1)

          script_anchor = '    <script src="simple-runtime.js"></script>\n    <script src="nonstop-browser.js" defer></script>\n'
          if index.count(script_anchor) != 1:
              raise SystemExit('expected exactly one player runtime script anchor')
          index = index.replace(
              script_anchor,
              '    <script src="simple-runtime.js"></script>\n    <script src="assets/runtime/fullscreen-control.js" defer></script>\n    <script src="nonstop-browser.js" defer></script>\n',
              1,
          )
          index_path.write_text(index)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']

          module_anchor = 'node --check assets/runtime/continuous-set-state.js &&'
          if scripts['check:modules'].count(module_anchor) != 1:
              raise SystemExit('expected exactly one check:modules anchor')
          scripts['check:modules'] = scripts['check:modules'].replace(
              module_anchor,
              module_anchor + ' node --check assets/runtime/fullscreen-control.js && node --check scripts/lib/validate-fullscreen-control.mjs &&',
              1,
          )

          check_anchor = 'npm run sheet:startup:validate &&'
          if scripts['check'].count(check_anchor) != 1:
              raise SystemExit('expected exactly one repository check anchor')
          scripts['check'] = scripts['check'].replace(
              check_anchor,
              check_anchor + ' npm run fullscreen:validate &&',
              1,
          )
          scripts['fullscreen:validate'] = 'node scripts/lib/validate-fullscreen-control.mjs'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Validate focused fullscreen contract
        run: |
          node --check assets/runtime/fullscreen-control.js
          node --check scripts/lib/validate-fullscreen-control.mjs
          npm run check:modules
          npm run fullscreen:validate
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue-925-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pwa): wire capability-gated fullscreen control"
          git push origin HEAD:pwa/issue-925-fullscreen-control
