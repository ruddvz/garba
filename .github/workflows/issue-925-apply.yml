name: Issue 925 refresh fullscreen integration

on:
  push:
    branches:
      - pwa/issue-925-fullscreen-control

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pwa/issue-925-fullscreen-control
          fetch-depth: 0

      - name: Wire deterministic fullscreen build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          package = json.loads(path.read_text())
          scripts = package['scripts']

          builder = 'node --check scripts/lib/build-fullscreen-control-runtime.mjs'
          if builder not in scripts['check:modules']:
              anchor = 'node --check assets/runtime/fullscreen-control.js &&'
              if scripts['check:modules'].count(anchor) != 1:
                  raise SystemExit('expected exactly one fullscreen runtime syntax anchor')
              scripts['check:modules'] = scripts['check:modules'].replace(
                  anchor,
                  anchor + ' ' + builder + ' &&',
                  1,
              )

          scripts['fullscreen:build'] = 'node scripts/lib/build-fullscreen-control-runtime.mjs'
          path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')
          PY

          node scripts/lib/build-fullscreen-control-runtime.mjs

      - name: Validate fullscreen integration
        run: |
          node --check scripts/lib/build-fullscreen-control-runtime.mjs
          node --check assets/runtime/fullscreen-control.js
          node --check scripts/lib/validate-fullscreen-control.mjs
          npm run check:modules
          npm run fullscreen:validate
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          # This workflow is a branch-only patch helper and must not survive review.
          rm .github/workflows/issue-925-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(pwa): consume canonical fullscreen contracts"
          git push origin HEAD:pwa/issue-925-fullscreen-control
