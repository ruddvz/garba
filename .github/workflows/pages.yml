name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app
        run: npm run check
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy only the production runtime. Optional/prototype browser modules live
          # under src/optional and are intentionally excluded from the Pages artifact.
          cp \
            index.html \
            app.js \
            simple-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _site/
          cp -R assets data _site/

          # Flatten the ordered source layers into one production stylesheet so the
          # browser paints from one CSS request instead of an @import chain.
          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            > _site/styles.css

          # Assert every local runtime script referenced by index.html exists in the
          # deploy artifact so a successful validation cannot still ship a 404.
          for src in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)"/\1/'); do
            case "$src" in
              http://*|https://*|//*) continue ;;
            esac
            test -f "_site/$src" || { echo "Missing deployed script: $src"; exit 1; }
          done

          # Canonical visual pack: all 15 approved 2K WebPs. Source history keeps the
          # packed file; Pages serves only the extracted images.
          PACK='assets/backgrounds/garba15-2k.zip'
          test -f "$PACK" || { echo 'Required 15-image 2K WebP pack is missing.'; exit 1; }
          mkdir -p _site/assets/backgrounds/library
          unzip -oq "$PACK" -d _site/assets/backgrounds/library

          WEBP_COUNT="$(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$WEBP_COUNT" -eq 15 || { echo "Expected 15 WebPs, found $WEBP_COUNT"; exit 1; }

          while IFS= read -r image; do
            file "$image" | grep -q 'Web/P image' || { echo "Not a valid WebP: $image"; exit 1; }
          done < <(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | sort)

          # Do not ship the source ZIP to visitors. It duplicates every background
          # and is not needed at runtime.
          rm -f _site/assets/backgrounds/garba15-2k.zip

          if grep -q '@import' _site/styles.css; then
            echo 'Production styles.css still contains @import'; exit 1
          fi

          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
