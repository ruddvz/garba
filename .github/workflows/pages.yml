name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app
        run: npm run check
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Copy only the production runtime and launch metadata. Optional/prototype
          # browser modules live under src/optional and are intentionally excluded
          # from the Pages artifact.
          cp \
            CNAME \
            robots.txt \
            sitemap.xml \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _site/
          cp -R assets data _site/

          # Flatten the ordered source layers into one production stylesheet so the
          # browser paints from one CSS request instead of an @import chain.
          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            > _site/styles.css

          # Assert direct and transitive production runtime files are all present.
          # provider-runtime.js, player-continuity.js and youtube-player-runtime.js are
          # loaded synchronously by simple-runtime.js, so checking index.html alone
          # is not sufficient.
          for runtime in \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            app.js \
            sw.js; do
            test -f "_site/$runtime" || { echo "Missing deployed runtime: $runtime"; exit 1; }
          done

          # Assert the production-domain contract ships with every deploy.
          test "$(tr -d '\r\n' < _site/CNAME)" = 'playgarba.com' || { echo 'CNAME must remain playgarba.com'; exit 1; }
          grep -q '^Sitemap: https://playgarba.com/sitemap.xml$' _site/robots.txt || { echo 'robots.txt missing canonical sitemap'; exit 1; }
          grep -q '<loc>https://playgarba.com/</loc>' _site/sitemap.xml || { echo 'sitemap.xml missing canonical root'; exit 1; }

          # Assert every local runtime script referenced directly by index.html exists
          # in the deploy artifact as an additional guard. Versioned runtime URLs use
          # query strings, so validate the underlying deployed path.
          for src in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)"/\1/'); do
            src="${src%%\?*}"
            case "$src" in
              http://*|https://*|//*) continue ;;
            esac
            test -f "_site/$src" || { echo "Missing deployed script: $src"; exit 1; }
          done

          # Canonical visual pack: prefer the approved 2048px Q90 export. Keep the
          # existing 2K/Q82 pack only as a temporary fallback until the Q90 archive
          # is uploaded. Pages serves extracted WebPs only, never the source ZIP.
          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
            echo '4690046d30ecd5400b3fc953a2a93f877d64921a69955d2b5dc6aa0bd65a769d  assets/backgrounds/garba15-2048-q90.zip' | sha256sum -c -
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi

          test -n "$PACK" || { echo 'Required 15-image WebP pack is missing.'; exit 1; }
          echo "Deploying visual pack: $PACK"
          mkdir -p _site/assets/backgrounds/library
          rm -f _site/assets/backgrounds/library/*.webp
          unzip -oq "$PACK" -d _site/assets/backgrounds/library

          WEBP_COUNT="$(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$WEBP_COUNT" -eq 15 || { echo "Expected 15 WebPs, found $WEBP_COUNT"; exit 1; }

          while IFS= read -r image; do
            file "$image" | grep -q 'Web/P image' || { echo "Not a valid WebP: $image"; exit 1; }
          done < <(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | sort)

          # Do not ship source archives to visitors. They duplicate every background
          # and are not needed at runtime.
          rm -f _site/assets/backgrounds/garba15-*.zip

          # Build crawlable catalogue pages from the same generated song/release data
          # the player uses. The generator also replaces the seed sitemap with the
          # complete canonical catalogue sitemap.
          node scripts/lib/generate-static-catalogue-pages.mjs _site
          SONG_PAGE_COUNT="$(find _site/songs -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l | tr -d ' ')"
          RELEASE_PAGE_COUNT="$(find _site/releases -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l | tr -d ' ')"
          SITEMAP_URL_COUNT="$(grep -o '<loc>' _site/sitemap.xml | wc -l | tr -d ' ')"
          test "$SONG_PAGE_COUNT" -ge 1000 || { echo "Expected 1000+ song pages, found $SONG_PAGE_COUNT"; exit 1; }
          test "$RELEASE_PAGE_COUNT" -ge 100 || { echo "Expected 100+ release pages, found $RELEASE_PAGE_COUNT"; exit 1; }
          test "$SITEMAP_URL_COUNT" -ge 1100 || { echo "Expected 1100+ sitemap URLs, found $SITEMAP_URL_COUNT"; exit 1; }
          test -f _site/catalogue/index.html || { echo 'Catalogue index page is missing'; exit 1; }

          if grep -q '@import' _site/styles.css; then
            echo 'Production styles.css still contains @import'; exit 1
          fi

          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
