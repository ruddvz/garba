name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app
        run: npm run check
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html app.js visual-library.js catalogue-bootstrap.js player-engine.js ux-polish.js styles.css manifest.webmanifest offline.html sw.js _site/
          cp -R styles assets data _site/

          # Canonical visual pack: 15 approved 2K WebPs. Keeping one zip in
          # Git keeps source history compact while Pages serves normal WebPs.
          PACK=''
          if [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi

          if [ -n "$PACK" ]; then
            mkdir -p _site/assets/backgrounds/library
            unzip -oq "$PACK" -d _site/assets/backgrounds/library
            test "$(find _site/assets/backgrounds/library -maxdepth 1 -name '*.webp' | wc -l)" -eq 15
          else
            echo '2K visual pack not present yet; keeping SVG fallbacks for this deployment.'
          fi

          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
