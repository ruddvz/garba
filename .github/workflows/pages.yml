name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app
        run: npm run check
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          # Runtime files. Production CSS is flattened below so the browser does
          # not wait on seven chained @import requests before it can paint.
          cp index.html *.js manifest.webmanifest offline.html _site/
          cp -R assets data _site/
          cat \
            styles/part-1.css \
            styles/part-2.css \
            styles/part-3.css \
            styles/part-4.css \
            styles/part-5.css \
            styles/part-6.css \
            styles/part-7.css \
            > _site/styles.css

          # Assert every local runtime script referenced by index.html exists in
          # the deploy artifact so a successful validation cannot still ship a 404.
          for src in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)"/\1/'); do
            case "$src" in
              http://*|https://*|//*) continue ;;
            esac
            test -f "_site/$src" || { echo "Missing deployed script: $src"; exit 1; }
          done

          # Canonical visual pack: all 15 user-approved 2K WebPs. Source history
          # keeps the packed file; Pages serves only the extracted WebPs.
          PACK=''
          if [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi

          test -n "$PACK" || { echo 'Required 15-image 2K WebP pack is missing.'; exit 1; }
          mkdir -p _site/assets/backgrounds/library
          unzip -oq "$PACK" -d _site/assets/backgrounds/library

          WEBP_COUNT="$(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$WEBP_COUNT" -eq 15 || { echo "Expected 15 WebPs, found $WEBP_COUNT"; exit 1; }

          while IFS= read -r image; do
            file "$image" | grep -q 'Web/P image' || { echo "Not a valid WebP: $image"; exit 1; }
          done < <(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | sort)

          # Do not ship the source ZIP to visitors. It duplicates every background
          # and is not needed at runtime.
          rm -f _site/assets/backgrounds/garba15-2k*.zip

          # Production CSS must be one request and must not contain imports.
          if grep -q '@import' _site/styles.css; then
            echo 'Production styles.css still contains @import'; exit 1
          fi

          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
