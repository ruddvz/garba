name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app
        run: npm run check
      - name: Install social and icon renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp fonts-gfs-didot icoutils
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          cp \
            CNAME \
            robots.txt \
            sitemap.xml \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _site/
          cp -R assets data _site/

          # Keep seek truth inside the existing network-first app.js payload so the
          # installed PWA does not gain another runtime request or stale cache surface.
          cat app.js assets/runtime/seek-state.js > _site/app.js
          grep -q 'GARBA_SEEK_STATE_RUNTIME' _site/app.js || { echo 'Seek-state runtime missing from deployed app.js'; exit 1; }

          # The catalogue is one supporting page. Collection, album and song browsing
          # are in-page states rather than standalone song/release URL trees.
          mkdir -p _site/catalogue
          cp src/catalogue/index.html _site/catalogue/index.html
          cp src/catalogue/catalogue.css _site/catalogue/catalogue.css
          cp src/catalogue/catalogue.js _site/catalogue/catalogue.js
          cp src/catalogue/listening-library.js _site/catalogue/listening-library.js

          # Render every platform icon from the canonical Garba mark. Android gets
          # separate maskable artwork, while Apple, browser and Windows surfaces use
          # the canonical mark at their native dimensions.
          mkdir -p _site/assets/icons
          rsvg-convert -w 16 -h 16 assets/icons/icon.svg -o _site/assets/icons/favicon-16.png
          rsvg-convert -w 32 -h 32 assets/icons/icon.svg -o _site/assets/icons/favicon-32.png
          rsvg-convert -w 48 -h 48 assets/icons/icon.svg -o _site/assets/icons/favicon-48.png
          rsvg-convert -w 152 -h 152 assets/icons/icon.svg -o _site/assets/icons/apple-touch-icon-152.png
          rsvg-convert -w 167 -h 167 assets/icons/icon.svg -o _site/assets/icons/apple-touch-icon-167.png
          rsvg-convert -w 180 -h 180 assets/icons/icon.svg -o _site/assets/icons/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 assets/icons/icon.svg -o _site/assets/icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/icons/icon.svg -o _site/assets/icons/icon-512.png
          rsvg-convert -w 150 -h 150 assets/icons/icon.svg -o _site/assets/icons/mstile-150x150.png
          rsvg-convert -w 310 -h 310 assets/icons/icon.svg -o _site/assets/icons/mstile-310x310.png
          rsvg-convert -w 192 -h 192 assets/icons/maskable.svg -o _site/assets/icons/maskable-192.png
          rsvg-convert -w 512 -h 512 assets/icons/maskable.svg -o _site/assets/icons/maskable-512.png
          icotool -c -o _site/favicon.ico \
            _site/assets/icons/favicon-16.png \
            _site/assets/icons/favicon-32.png \
            _site/assets/icons/favicon-48.png

          file _site/assets/icons/favicon-16.png | grep -q 'PNG image data, 16 x 16' || { echo 'Favicon 16 is invalid'; exit 1; }
          file _site/assets/icons/favicon-32.png | grep -q 'PNG image data, 32 x 32' || { echo 'Favicon 32 is invalid'; exit 1; }
          file _site/assets/icons/favicon-48.png | grep -q 'PNG image data, 48 x 48' || { echo 'Favicon 48 is invalid'; exit 1; }
          file _site/favicon.ico | grep -q 'MS Windows icon resource' || { echo 'favicon.ico is invalid'; exit 1; }
          file _site/assets/icons/apple-touch-icon-152.png | grep -q 'PNG image data, 152 x 152' || { echo 'Apple 152 icon is invalid'; exit 1; }
          file _site/assets/icons/apple-touch-icon-167.png | grep -q 'PNG image data, 167 x 167' || { echo 'Apple 167 icon is invalid'; exit 1; }
          file _site/assets/icons/apple-touch-icon.png | grep -q 'PNG image data, 180 x 180' || { echo 'Apple 180 icon is invalid'; exit 1; }
          file _site/assets/icons/icon-192.png | grep -q 'PNG image data, 192 x 192' || { echo 'PWA 192 icon is invalid'; exit 1; }
          file _site/assets/icons/icon-512.png | grep -q 'PNG image data, 512 x 512' || { echo 'PWA 512 icon is invalid'; exit 1; }
          file _site/assets/icons/mstile-150x150.png | grep -q 'PNG image data, 150 x 150' || { echo 'Windows 150 tile is invalid'; exit 1; }
          file _site/assets/icons/mstile-310x310.png | grep -q 'PNG image data, 310 x 310' || { echo 'Windows 310 tile is invalid'; exit 1; }
          file _site/assets/icons/maskable-192.png | grep -q 'PNG image data, 192 x 192' || { echo 'Maskable 192 is invalid'; exit 1; }
          file _site/assets/icons/maskable-512.png | grep -q 'PNG image data, 512 x 512' || { echo 'Maskable 512 is invalid'; exit 1; }

          # Explore is a real navigation surface. Convert the legacy source button into
          # a plain catalogue link in the production artifact and prevent app.js from
          # attaching the old song-sheet toggle to that link.
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('_site/index.html')
          html = page.read_text()
          pattern = re.compile(
              r'<button\s+class="browse-button"\s+id="browseButton"[^>]*>\s*'
              r'<span>Browse songs</span>\s*'
              r'<svg[^>]*>.*?</svg>\s*'
              r'</button>',
              re.DOTALL,
          )
          replacement = '''<a class="browse-button" id="browseButton" href="./catalogue/" aria-label="Explore PlayGarba catalogue" style="text-decoration:none">
            <span>Explore</span>
          </a>'''
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one homepage Browse songs control, transformed {count}.')
          page.write_text(html)

          runtime = Path('_site/app.js')
          js = runtime.read_text()
          old_click = '''  els.browseButton.addEventListener('click', () => {
    if (state.sheetSnap === 'closed' || state.sheetSnap === 'collapsed') openSheet('all', { trigger: els.browseButton });
    else closeSheet();
  });'''
          new_click = '''  if (els.browseButton?.tagName !== 'A') {
    els.browseButton?.addEventListener('click', () => {
      if (state.sheetSnap === 'closed' || state.sheetSnap === 'collapsed') openSheet('all', { trigger: els.browseButton });
      else closeSheet();
    });
  }'''
          if old_click not in js:
              raise SystemExit('Could not locate legacy Browse songs click handler.')
          js = js.replace(old_click, new_click, 1)
          js = js.replace(
              "  els.browseButton.setAttribute('aria-expanded', String(open));",
              "  if (els.browseButton?.hasAttribute('aria-controls')) els.browseButton.setAttribute('aria-expanded', String(open));",
              1,
          )
          runtime.write_text(js)
          PY
          grep -q 'href="./catalogue/"' _site/index.html || { echo 'Homepage Explore link missing'; exit 1; }
          grep -q '<span>Explore</span>' _site/index.html || { echo 'Homepage Explore label missing'; exit 1; }
          ! grep -q 'id="browseButton"[^>]*aria-controls' _site/index.html || { echo 'Explore must not retain song-sheet semantics'; exit 1; }

          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _site/styles.css

          for runtime in \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            app.js \
            sw.js; do
            test -f "_site/$runtime" || { echo "Missing deployed runtime: $runtime"; exit 1; }
          done

          # Emergency rollback: keep GitHub Pages on the known apex custom-domain
          # contract until live.playgarba.com has both DNS and Pages custom-domain
          # configuration confirmed healthy. A CNAME written only into an Actions
          # artifact does not configure the Pages custom domain.
          test "$(tr -d '\r\n' < _site/CNAME)" = 'playgarba.com' || { echo 'CNAME must remain playgarba.com'; exit 1; }
          grep -q '^Sitemap: https://playgarba.com/sitemap.xml$' _site/robots.txt || { echo 'robots.txt missing canonical sitemap'; exit 1; }
          grep -q '<loc>https://playgarba.com/</loc>' _site/sitemap.xml || { echo 'sitemap.xml missing canonical root'; exit 1; }
          grep -q '<loc>https://playgarba.com/catalogue/</loc>' _site/sitemap.xml || { echo 'sitemap.xml missing catalogue'; exit 1; }

          for src in $(grep -oE '<script[^>]+src="[^"]+"' index.html | sed -E 's/.*src="([^"]+)"/\1/'); do
            src="${src%%\?*}"
            case "$src" in
              http://*|https://*|//*) continue ;;
            esac
            test -f "_site/$src" || { echo "Missing deployed script: $src"; exit 1; }
          done

          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
            echo '4690046d30ecd5400b3fc953a2a93f877d64921a69955d2b5dc6aa0bd65a769d  assets/backgrounds/garba15-2048-q90.zip' | sha256sum -c -
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi
          test -n "$PACK" || { echo 'Required 15-image WebP pack is missing.'; exit 1; }
          echo "Deploying visual pack: $PACK"
          mkdir -p _site/assets/backgrounds/library
          rm -f _site/assets/backgrounds/library/*.webp
          unzip -oq "$PACK" -d _site/assets/backgrounds/library

          WEBP_COUNT="$(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$WEBP_COUNT" -eq 15 || { echo "Expected 15 WebPs, found $WEBP_COUNT"; exit 1; }
          while IFS= read -r image; do
            file "$image" | grep -q 'Web/P image' || { echo "Not a valid WebP: $image"; exit 1; }
          done < <(find _site/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | sort)

          # Build the universal social card from the exact approved courtyard artwork,
          # not a regenerated version of it. The temporary PNG only bridges WebP into
          # the SVG renderer and is removed immediately after the 1200x630 card exists.
          OG_BACKGROUND='_site/assets/backgrounds/library/04-colourful-garba-courtyard-a.webp'
          test -f "$OG_BACKGROUND" || { echo 'Approved OG courtyard artwork is missing'; exit 1; }
          mkdir -p _site/assets/social
          dwebp "$OG_BACKGROUND" -quiet -o _site/assets/social/og-background.png
          rsvg-convert -w 1200 -h 630 _site/assets/social/playgarba-og-card.svg -o _site/assets/social/garba-og-card.png
          file _site/assets/social/garba-og-card.png | grep -q 'PNG image data, 1200 x 630' || { echo 'Social preview must be a valid 1200x630 PNG'; exit 1; }
          rm -f _site/assets/social/og-background.png
          rm -f _site/assets/backgrounds/garba15-*.zip

          # Apply universal social and icon metadata to every real HTML surface while
          # preserving each page's canonical metadata.
          node scripts/lib/inject-social-preview.mjs _site
          node scripts/lib/inject-brand-metadata.mjs _site

          # Product contract: do not deploy standalone song/release pages.
          test -f _site/catalogue/index.html || { echo 'Catalogue page is missing'; exit 1; }
          test -f _site/catalogue/catalogue.js || { echo 'Catalogue runtime is missing'; exit 1; }
          test -f _site/catalogue/catalogue.css || { echo 'Catalogue styles are missing'; exit 1; }
          test -f _site/catalogue/listening-library.js || { echo 'Return-user listening companion is missing'; exit 1; }
          grep -q 'src="listening-library.js"' _site/catalogue/index.html || { echo 'Catalogue does not load return-user listening companion'; exit 1; }
          test ! -d _site/songs || { echo 'Standalone song pages must not be deployed'; exit 1; }
          test ! -d _site/releases || { echo 'Standalone release pages must not be deployed'; exit 1; }

          SOCIAL_HTML_COUNT="$(find _site -type f -name '*.html' | wc -l | tr -d ' ')"
          SOCIAL_META_COUNT="$(grep -RIl 'https://playgarba.com/assets/social/garba-og-card.png' _site --include='*.html' | wc -l | tr -d ' ')"
          BRAND_META_COUNT="$(grep -RIl 'apple-touch-icon-167.png' _site --include='*.html' | wc -l | tr -d ' ')"
          test "$SOCIAL_META_COUNT" -eq "$SOCIAL_HTML_COUNT" || { echo "Universal social preview missing from some pages: $SOCIAL_META_COUNT/$SOCIAL_HTML_COUNT"; exit 1; }
          test "$BRAND_META_COUNT" -eq "$SOCIAL_HTML_COUNT" || { echo "Universal icon metadata missing from some pages: $BRAND_META_COUNT/$SOCIAL_HTML_COUNT"; exit 1; }
          grep -q 'name="twitter:card" content="summary_large_image"' _site/index.html || { echo 'Large Twitter card metadata was not injected'; exit 1; }
          grep -q 'name="twitter:card" content="summary_large_image"' _site/catalogue/index.html || { echo 'Catalogue large Twitter card metadata was not injected'; exit 1; }
          grep -q 'href="/favicon.ico"' _site/index.html || { echo 'favicon.ico metadata was not injected'; exit 1; }
          grep -q 'sizes="152x152"' _site/index.html || { echo 'iPad 152 icon metadata was not injected'; exit 1; }
          grep -q 'sizes="167x167"' _site/index.html || { echo 'iPad Pro 167 icon metadata was not injected'; exit 1; }
          grep -q 'sizes="180x180"' _site/index.html || { echo 'iPhone 180 icon metadata was not injected'; exit 1; }
          grep -q 'name="msapplication-config" content="/assets/icons/browserconfig.xml"' _site/index.html || { echo 'Windows tile metadata was not injected'; exit 1; }

          if grep -q '@import' _site/styles.css; then
            echo 'Production styles.css still contains @import'; exit 1
          fi

          # Keep the deploy artifact on the apex until the live-subdomain infrastructure
          # gate is truly healthy. Do not advertise or emit live.playgarba.com here.
          grep -q '<link rel="canonical" href="https://playgarba.com/"' _site/index.html || { echo 'Player canonical must remain on apex'; exit 1; }
          grep -q '<link rel="canonical" href="https://playgarba.com/catalogue/"' _site/catalogue/index.html || { echo 'Catalogue canonical must remain on apex'; exit 1; }
          if grep -Rqs 'https://live.playgarba.com' _site --include='*.html' --include='*.xml' --include='*.txt'; then
            echo 'Deploy artifact must not advertise live.playgarba.com before infrastructure is ready'; exit 1
          fi

          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
