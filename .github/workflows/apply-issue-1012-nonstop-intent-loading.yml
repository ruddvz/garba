name: Apply issue 1012 Nonstop intent loading

on:
  push:
    branches:
      - perf/issue-1012-nonstop-intent-loading
    paths:
      - '.github/workflows/apply-issue-1012-nonstop-intent-loading.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out claimed branch
        uses: actions/checkout@v6
        with:
          ref: perf/issue-1012-nonstop-intent-loading
          fetch-depth: 0

      - name: Remove idle Nonstop warming and add regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('nonstop-browser.js')
          source = runtime_path.read_text()
          start_marker = '\n  function warmNonstop() {'
          end_marker = '\n  function captureNonstopKeyboard'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Expected one bounded warmNonstop section')
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          source = source[:start] + '\n' + source[end:]
          startup_call = "    warmNonstop();\n    restoreFromUrl();"
          if source.count(startup_call) != 1:
              raise SystemExit('Expected exactly one startup warmNonstop call')
          source = source.replace(startup_call, "    restoreFromUrl();", 1)
          if 'warmNonstop' in source or 'requestIdleCallback' in source:
              raise SystemExit('Idle Nonstop warm machinery remains after patch')
          runtime_path.write_text(source)
          PY

          mkdir -p scripts/lib .github/workflows
          cat > scripts/lib/validate-nonstop-intent-loading.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const source = readFileSync(new URL('../../nonstop-browser.js', import.meta.url), 'utf8');

          assert.equal(source.includes('function warmNonstop'), false, 'ordinary startup must not define an idle full-catalogue warmer');
          assert.equal(source.includes('warmNonstop();'), false, 'ordinary startup must not invoke an idle full-catalogue warmer');
          assert.equal(source.includes('requestIdleCallback'), false, 'Nonstop runtime must not schedule full-catalogue work through requestIdleCallback');

          const initStart = source.indexOf('  function init() {');
          const apiStart = source.indexOf('\n  window.GARBA_NONSTOP', initStart);
          assert.notEqual(initStart, -1, 'init must exist');
          assert.notEqual(apiStart, -1, 'public Nonstop API must follow init');
          const init = source.slice(initStart, apiStart);
          assert.equal(init.includes('loadAllSets('), false, 'init must not load the full Nonstop catalogue');
          assert.equal(init.includes('restoreFromUrl();'), true, 'init must preserve explicit Nonstop deep-link restoration');

          assert.match(source, /async function openBrowser\(\)[\s\S]*?await Promise\.all\(\[loadAllSets\(\),\s*loadSearchCore\(\)\]\)/, 'opening the chooser must still deliberately load the catalogue');
          assert.match(source, /function restoreFromUrl\(\)[\s\S]*?searchParams\.get\(['"]nonstop['"]\)[\s\S]*?startNonstop\(id,\s*\{\s*quiet:\s*true\s*\}\)/, 'deep-link restoration must still resolve and start the requested set');
          assert.match(source, /list:\s*async\s*\(\)\s*=>\s*loadAllSets\(\)/, 'GARBA_NONSTOP.list() must remain an explicit catalogue-loading API');
          assert.match(source, /if\s*\(state\.allSets\)\s*return\s+state\.allSets;/, 'full catalogue loading must remain cached within the document');
          assert.match(source, /Promise\.all\(index\.chunks\.map\(loadChunk\)\)/, 'explicit catalogue loading must still load indexed discovery chunks');

          console.log('✓ Nonstop discovery is intent-driven: idle startup warming removed; chooser, deep-link and list loading preserved.');
          EOF

          cat > .github/workflows/nonstop-intent-loading-validate.yml <<'EOF'
          name: Nonstop intent loading validate

          on:
            pull_request:
              paths:
                - 'nonstop-browser.js'
                - 'scripts/lib/validate-nonstop-intent-loading.mjs'
                - '.github/workflows/nonstop-intent-loading-validate.yml'
            push:
              branches:
                - main
              paths:
                - 'nonstop-browser.js'
                - 'scripts/lib/validate-nonstop-intent-loading.mjs'
                - '.github/workflows/nonstop-intent-loading-validate.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                - name: Use Node.js 22
                  uses: actions/setup-node@v5
                  with:
                    node-version: 22
                - name: Check Nonstop runtime syntax
                  run: node --check nonstop-browser.js
                - name: Validate intent-driven Nonstop loading
                  run: node scripts/lib/validate-nonstop-intent-loading.mjs
          EOF

          rm .github/workflows/apply-issue-1012-nonstop-intent-loading.yml
          node --check nonstop-browser.js
          node scripts/lib/validate-nonstop-intent-loading.mjs

      - name: Commit exact claimed result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A nonstop-browser.js scripts/lib/validate-nonstop-intent-loading.mjs .github/workflows/nonstop-intent-loading-validate.yml .github/workflows/apply-issue-1012-nonstop-intent-loading.yml
          git diff --cached --stat
          git commit -m 'Defer Nonstop catalogue loading until intent (#1012)'
          git push origin HEAD:perf/issue-1012-nonstop-intent-loading
