name: Apply issue 1035 Explore payload dedupe

on:
  push:
    branches:
      - perf/issue-1035-explore-page-data-dedupe
    paths:
      - '.github/workflows/apply-issue-1035.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/issue-1035-explore-page-data-dedupe
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply exact bounded source patch
        run: python3 scripts/tmp/apply-issue-1035.py
      - name: Validate source and repository
        run: |
          node --check src/catalogue/catalogue.js
          node --check src/catalogue/listening-library.js
          node --check .github/browser/explore-payload-dedupe.mjs
          npm run check
      - name: Remove temporary tooling and commit product/test files
        run: |
          rm scripts/tmp/apply-issue-1035.py .github/workflows/apply-issue-1035.yml
          git config user.name 'PlayGarba recovery bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/catalogue/catalogue.js src/catalogue/listening-library.js scripts/tmp/apply-issue-1035.py .github/workflows/apply-issue-1035.yml
          git commit -m 'Deduplicate Explore catalogue payload reads'
          git push origin HEAD:perf/issue-1035-explore-page-data-dedupe
