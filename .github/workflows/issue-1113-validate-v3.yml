name: Issue 1113 validation v3

on:
  push:
    branches:
      - catalogue/issue-1113-de-taali-complete

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded catalogue reconciliation in runner workspace
        run: node .github/issue-1113-apply.cjs
      - name: Validate
        run: |
          npm run catalogue
          npm run catalogue:metadata:audit
          npm run presentation:validate
          npm run release:context:validate
          node scripts/validate-runtime-song-routes.mjs
          npm run check
