name: Apply issue 811 Nonstop chooser cleanup

on:
  push:
    branches:
      - ux/nonstop-chooser-cleanup-811
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nonstop-chooser-cleanup-811
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair validator generator escaping
        run: python -c "from pathlib import Path; p=Path('.github/scripts/apply-issue-811.py'); s=p.read_text(); p.write_text(s.replace(\"ui_checks = '''\", \"ui_checks = r'''\", 1))"

      - name: Apply bounded chooser cleanup
        run: python .github/scripts/apply-issue-811.py

      - name: Validate focused Nonstop UI contract
        shell: bash
        run: |
          set -euo pipefail
          node --check nonstop-browser.js
          node --check scripts/lib/validate-nonstop-transport-ux.mjs
          node scripts/lib/validate-nonstop-transport-ux.mjs
          node scripts/validate-youtube-player-runtime.mjs

      - name: Run full repository validation
        run: npm run check

      - name: Commit final tree without temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-issue-811-nonstop-ui.yml
          rm .github/scripts/apply-issue-811.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Simplify Nonstop chooser UI'
          git push origin HEAD:ux/nonstop-chooser-cleanup-811
