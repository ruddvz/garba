name: Apply listening flow label

on:
  push:
    branches: [codex/listening-flow-287-current-main]
    paths:
      - '.github/workflows/apply-listening-flow-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/listening-flow-287-current-main
          fetch-depth: 0

      - name: Apply exact My Garba label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'aria-label="Show favourites" title="Favourites"'
          new = 'aria-label="Open My Garba" title="My Garba"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old favourites label, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q 'aria-label="Open My Garba" title="My Garba"' index.html
          grep -q '<link rel="canonical" href="https://playgarba.com/"' index.html
          grep -q '<meta property="og:url" content="https://playgarba.com/"' index.html
          grep -q 'href="./explore/"' index.html

      - name: Commit branch-only integration edit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'My Garba label already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply My Garba label on current apex shell'
          git push origin HEAD:codex/listening-flow-287-current-main
