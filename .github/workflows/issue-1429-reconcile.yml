name: Issue 1429 reconcile latest main

on:
  push:
    branches:
      - youtube/issue-1429-hardik-prachin

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Validate reconciled tree
        run: npm run check

      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/issue-1429-reconcile.yml
          git add .github/workflows/issue-1429-reconcile.yml
          git diff --cached --check
          git commit -m "chore: remove issue 1429 reconcile helper"
          git push origin HEAD:youtube/issue-1429-hardik-prachin
