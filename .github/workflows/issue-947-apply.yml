name: Apply issue 947 RAAS health fixture update

on:
  push:
    branches:
      - fix/issue-947-raas-health-fixtures
    paths:
      - .github/workflows/issue-947-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-947-raas-health-fixtures
          fetch-depth: 0

      - name: Apply exact fixture URL replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/pga/health/tests/health.test.mjs'),
              Path('src/pga/health/tests/evidence-adapters.test.mjs'),
          ]
          old = 'https://github.com/ruddvz/garba/actions'
          new = 'https://github.com/ruddvz/raas/actions'

          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: expected at least one old repository Actions fixture URL')
              path.write_text(text.replace(old, new))
              updated = path.read_text()
              if old in updated:
                  raise SystemExit(f'{path}: stale repository Actions fixture URL remains')
              print(f'{path}: replaced {count} fixture URL occurrence(s)')
          PY

      - name: Run focused PGA health tests
        run: node --test src/pga/health/tests/health.test.mjs src/pga/health/tests/evidence-adapters.test.mjs

      - name: Verify bounded diff and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/pga/health/tests/health.test.mjs src/pga/health/tests/evidence-adapters.test.mjs
          git rm .github/workflows/issue-947-apply.yml
          changed="$(git diff --name-only --cached; git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | sort -u | grep -Ev '^(\.github/workflows/issue-947-apply\.yml|src/pga/health/tests/health\.test\.mjs|src/pga/health/tests/evidence-adapters\.test\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pga/health/tests/health.test.mjs src/pga/health/tests/evidence-adapters.test.mjs
          git commit -m 'test(PGA): update RAAS health fixture URLs (#947)'
          git push origin HEAD:fix/issue-947-raas-health-fixtures
