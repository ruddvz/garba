name: Apply issue 1018 registry PR trigger patch

on:
  push:
    branches:
      - ci/issue-1018-registry-pr-trigger
    paths:
      - .github/workflows/apply-issue-1018-registry-pr-trigger.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/issue-1018-registry-pr-trigger
          fetch-depth: 0

      - name: Apply and validate bounded registry patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/agent-claim-registry.yml')
          text = p.read_text()
          replacements = [
              ('    types: [opened, closed, reopened]', '    types: [closed]'),
              ("              if (eventName === 'pull_request') return ['opened', 'closed', 'reopened'].includes(action);", "              if (eventName === 'pull_request') return action === 'closed';"),
              ("              assert(eventNeedsRecovery('pull_request', 'opened') && eventNeedsRecovery('pull_request', 'closed'), 'PR lifecycle runs perform recovery');", "              assert(!eventNeedsRecovery('pull_request', 'opened') && !eventNeedsRecovery('pull_request', 'reopened') && eventNeedsRecovery('pull_request', 'closed'), 'only PR close runs global recovery');"),
              ("              if (eventName === 'pull_request' && ['opened', 'closed', 'reopened'].includes(action)) {", "              if (eventName === 'pull_request' && action === 'closed') {")
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/agent-claim-registry.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'script: |') + 1
          block = lines[start:]
          nonblank = [len(line) - len(line.lstrip()) for line in block if line.strip()]
          indent = min(nonblank)
          js = '\n'.join(line[indent:] if line.strip() else '' for line in block) + '\n'
          Path('/tmp/registry-script.mjs').write_text(js)
          PY
          node --check /tmp/registry-script.mjs
          grep -F "types: [closed]" .github/workflows/agent-claim-registry.yml
          grep -F "if (eventName === 'pull_request') return action === 'closed';" .github/workflows/agent-claim-registry.yml
          grep -F "only PR close runs global recovery" .github/workflows/agent-claim-registry.yml
          grep -F "if (eventName === 'pull_request' && action === 'closed')" .github/workflows/agent-claim-registry.yml
          git diff --check

      - name: Create validated commit object
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-claim-registry.yml
          git commit -m "Stop registry checks on active PRs"
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:ci/issue-1018-registry-pr-trigger
