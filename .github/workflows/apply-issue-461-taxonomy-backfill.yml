name: Apply issue 461 taxonomy backfill

on:
  push:
    branches:
      - codex/nonstop-taxonomy-backfill-461

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nonstop-taxonomy-backfill-461
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact linked-release taxonomy
        run: python3 .github/scripts/apply-issue-461-taxonomy-backfill.py
      - name: Validate taxonomy and repository
        run: npm run check
      - name: Commit data patch and remove temporary migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/sets/sets-01.json data/discovery/sets/sets-08-rutvi-pandya.json data/discovery/sets/sets-18-alpa-current.json
          git rm .github/workflows/apply-issue-461-taxonomy-backfill.yml .github/scripts/apply-issue-461-taxonomy-backfill.py
          git commit -m "Backfill verified taxonomy for seven Nonstop sets"
          git push origin HEAD:codex/nonstop-taxonomy-backfill-461
