name: Agent file claim conflicts

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-file-claim-conflicts
  cancel-in-progress: false

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile cross-issue file ownership
        uses: actions/github-script@v7
        env:
          BOARD_ISSUE: "364"
          LEGACY_PR_MAX: "378"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const boardIssue = Number(process.env.BOARD_ISSUE);
            const legacyPrMax = Number(process.env.LEGACY_PR_MAX);
            const conflictLabel = 'agent:file-conflict';

            const claimRe = /<!--\s*agent-claim\s*\n([\s\S]*?)-->/i;
            const releaseRe = /<!--\s*agent-release\s*\n([\s\S]*?)-->/i;
            const overrideRe = /<!--\s*agent-claim-override\s*\n([\s\S]*?)-->/i;

            if (context.eventName === 'issue_comment') {
              const body = context.payload.comment?.body || '';
              if (!claimRe.test(body) && !releaseRe.test(body) && !overrideRe.test(body)) return;
            }

            function field(block, name) {
              const match = block.match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'mi'));
              return match ? match[1].trim() : '';
            }

            function parseEvent(comment) {
              const body = comment.body || '';
              const override = body.match(overrideRe);
              if (override) {
                return {
                  type: 'override',
                  author: comment.user?.login || 'unknown',
                  commentId: comment.id,
                };
              }

              const release = body.match(releaseRe);
              if (release) {
                return {
                  type: 'release',
                  agent: field(release[1], 'agent'),
                  branch: field(release[1], 'branch'),
                  commentId: comment.id,
                };
              }

              const claim = body.match(claimRe);
              if (claim) {
                return {
                  type: 'claim',
                  agent: field(claim[1], 'agent'),
                  branch: field(claim[1], 'branch'),
                  scope: field(claim[1], 'scope'),
                  files: field(claim[1], 'files'),
                  commentId: comment.id,
                };
              }

              return null;
            }

            function validClaim(event) {
              return event?.type === 'claim' && event.agent && event.branch && event.scope && event.files;
            }

            function sameOwner(a, b) {
              return Boolean(a && b && a.agent === b.agent && a.branch === b.branch);
            }

            function deriveState(comments) {
              let active = null;
              let claimConflicts = 0;

              for (const comment of [...comments].sort((a, b) => a.id - b.id)) {
                const event = parseEvent(comment);
                if (!event) continue;

                if (event.type === 'override') {
                  if (event.author === owner) {
                    active = null;
                    claimConflicts = 0;
                  }
                  continue;
                }

                if (event.type === 'release') {
                  if (active && sameOwner(active, event)) {
                    active = null;
                    claimConflicts = 0;
                  }
                  continue;
                }

                if (!validClaim(event)) continue;

                if (!active) {
                  active = event;
                  claimConflicts = 0;
                } else if (sameOwner(active, event)) {
                  active = event;
                } else {
                  claimConflicts += 1;
                }
              }

              return { active, claimConflicts };
            }

            async function listComments(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            function normalizeFileToken(raw) {
              let token = String(raw || '').trim().replace(/^`+|`+$/g, '').replace(/^\.\//, '');
              token = token.replace(/^(?:expected|likely)\s+/i, '').trim();
              return token;
            }

            function filePatterns(raw) {
              return String(raw || '')
                .split(';')
                .map(normalizeFileToken)
                .filter(Boolean)
                .filter(token => !/^research-only\b/i.test(token))
                .filter(token => !/^(?:none|n\/a)$/i.test(token));
            }

            function hasWildcard(pattern) {
              return /[*?]/.test(pattern);
            }

            function escapeRegex(char) {
              return /[\\^$+?.()|{}[\]]/.test(char) ? `\\${char}` : char;
            }

            function globRegex(pattern) {
              let out = '^';
              for (let i = 0; i < pattern.length; i += 1) {
                const char = pattern[i];
                if (char === '*') {
                  if (pattern[i + 1] === '*') {
                    out += '.*';
                    i += 1;
                  } else {
                    out += '[^/]*';
                  }
                } else if (char === '?') {
                  out += '[^/]';
                } else {
                  out += escapeRegex(char);
                }
              }
              return new RegExp(`${out}$`);
            }

            function staticPrefix(pattern) {
              const index = pattern.search(/[*?]/);
              return index === -1 ? pattern : pattern.slice(0, index);
            }

            function broadTreePattern(pattern) {
              return /(?:^|\/)\*\*$/.test(pattern) || /(?:^|\/)\*\*\/\*$/.test(pattern);
            }

            function patternsOverlap(a, b) {
              if (!a || !b) return false;
              if (a === b) return true;

              const aWild = hasWildcard(a);
              const bWild = hasWildcard(b);
              if (!aWild && !bWild) return false;
              if (!aWild) return globRegex(b).test(a);
              if (!bWild) return globRegex(a).test(b);

              if (broadTreePattern(a) && staticPrefix(b).startsWith(staticPrefix(a))) return true;
              if (broadTreePattern(b) && staticPrefix(a).startsWith(staticPrefix(b))) return true;
              return false;
            }

            function overlapPairs(leftFiles, rightFiles) {
              const pairs = [];
              for (const left of filePatterns(leftFiles)) {
                for (const right of filePatterns(rightFiles)) {
                  if (!patternsOverlap(left, right)) continue;
                  const text = left === right ? left : `${left} ↔ ${right}`;
                  if (!pairs.includes(text)) pairs.push(text);
                }
              }
              return pairs;
            }

            function assert(condition, message) {
              if (!condition) throw new Error(`Agent file ownership self-test failed: ${message}`);
            }

            function runSelfTests() {
              assert(overlapPairs('provider-runtime.js', 'provider-runtime.js').length === 1, 'exact path overlap');
              assert(overlapPairs('research-only', 'provider-runtime.js').length === 0, 'research-only owns no files');
              assert(overlapPairs('data/catalogue/**', 'data/catalogue/releases/releases-01.json').length === 1, 'tree glob matches exact path');
              assert(overlapPairs('data/catalogue/releases/*falguni*', 'data/catalogue/releases/releases-01-falguni.json').length === 1, 'filename glob matches exact path');
              assert(overlapPairs('provider-runtime.js', 'src/catalogue/catalogue.js').length === 0, 'independent files do not overlap');

              const first = { issue: { number: 10 }, state: { active: { commentId: 100, files: 'a.js' } } };
              const later = { issue: { number: 11 }, state: { active: { commentId: 200, files: 'a.js' } } };
              const ordered = [later, first].sort((a, b) => a.state.active.commentId - b.state.active.commentId || a.issue.number - b.issue.number);
              assert(ordered[0].issue.number === 10, 'earlier claim wins ordering');
            }

            async function ensureConflictLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: conflictLabel });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: conflictLabel,
                    color: 'FB8C00',
                    description: 'This active claim overlaps files already owned by an earlier active claim or legacy PR.',
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            function labelNames(issue) {
              return new Set((issue.labels || [])
                .map(label => typeof label === 'string' ? label : label?.name)
                .filter(Boolean));
            }

            async function addConflictLabel(row) {
              if (labelNames(row.issue).has(conflictLabel)) return;
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: row.issue.number,
                labels: [conflictLabel],
              });
            }

            async function removeConflictLabel(issue) {
              if (!labelNames(issue).has(conflictLabel)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: conflictLabel,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            async function collectClaimRows(extraIssueNumbers = []) {
              const claimed = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: 'agent:claimed',
                per_page: 100,
              });

              const byNumber = new Map();
              for (const issue of claimed) {
                if (issue.pull_request || issue.number === boardIssue) continue;
                byNumber.set(issue.number, issue);
              }

              for (const issueNumber of extraIssueNumbers) {
                if (!issueNumber || issueNumber === boardIssue || byNumber.has(issueNumber)) continue;
                try {
                  const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
                  if (!issue.pull_request && issue.state === 'open') byNumber.set(issue.number, issue);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const rows = [];
              for (const issue of byNumber.values()) {
                const comments = await listComments(issue.number);
                const state = deriveState(comments);
                if (state.active) rows.push({ issue, comments, state, fileConflicts: [] });
              }

              rows.sort((a, b) => a.state.active.commentId - b.state.active.commentId || a.issue.number - b.issue.number);
              return rows;
            }

            async function collectLegacyRows() {
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });

              const legacy = [];
              for (const pr of openPulls.filter(item => item.number <= legacyPrMax).sort((a, b) => a.number - b.number)) {
                const changed = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
                legacy.push({
                  pr,
                  files: changed.map(file => file.filename).join('; '),
                });
              }
              return legacy;
            }

            function annotateConflicts(rows, legacyRows) {
              for (const row of rows) row.fileConflicts = [];

              for (const row of rows) {
                for (const legacy of legacyRows) {
                  const paths = overlapPairs(row.state.active.files, legacy.files);
                  if (paths.length) {
                    row.fileConflicts.push({
                      blocker: `legacy PR #${legacy.pr.number}`,
                      blockerUrl: legacy.pr.html_url,
                      paths,
                    });
                  }
                }
              }

              for (let laterIndex = 0; laterIndex < rows.length; laterIndex += 1) {
                const later = rows[laterIndex];
                for (let earlierIndex = 0; earlierIndex < laterIndex; earlierIndex += 1) {
                  const earlier = rows[earlierIndex];
                  const paths = overlapPairs(later.state.active.files, earlier.state.active.files);
                  if (!paths.length) continue;
                  later.fileConflicts.push({
                    blocker: `issue #${earlier.issue.number}`,
                    blockerUrl: earlier.issue.html_url,
                    paths,
                  });
                }
              }

              return rows;
            }

            function conflictStatus(row) {
              return [
                '<!-- agent-file-conflict-status -->',
                '### Cross-issue file ownership',
                '',
                row.fileConflicts.length
                  ? '**Status:** Blocked by earlier file ownership'
                  : '**Status:** No active cross-issue file conflict',
                ...row.fileConflicts.flatMap(conflict => [
                  `- ${conflict.blocker}: ${conflict.paths.map(path => `\`${path}\``).join(', ')}`,
                ]),
                '',
                row.fileConflicts.length
                  ? 'Narrow this claim or wait for the earlier owner to release before editing the overlapping files.'
                  : 'The declared file scope is currently independent of earlier active claims and legacy PR files.',
              ].join('\n');
            }

            async function upsertConflictStatus(row) {
              const existing = row.comments.find(comment =>
                comment.body?.includes('<!-- agent-file-conflict-status -->') && comment.user?.type === 'Bot'
              );

              if (!row.fileConflicts.length && !existing) return;
              const wanted = conflictStatus(row);

              if (!existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: row.issue.number,
                  body: wanted,
                });
              } else if ((existing.body || '').trim() !== wanted.trim()) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: wanted,
                });
              }
            }

            function esc(value) {
              return String(value || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
            }

            async function updateBoard(rows) {
              const conflictRows = rows.flatMap(row => row.fileConflicts.map(conflict => ({ row, conflict })));
              const table = conflictRows.length
                ? [
                    '| Later claim | Earlier owner | Overlapping declared files |',
                    '| --- | --- | --- |',
                    ...conflictRows.map(({ row, conflict }) =>
                      `| #${row.issue.number} \`${esc(row.state.active.agent)}\` | ${esc(conflict.blocker)} | ${conflict.paths.map(path => `\`${esc(path)}\``).join('<br>')} |`
                    ),
                  ].join('\n')
                : '_No active cross-issue file conflicts._';

              const board = await github.rest.issues.get({ owner, repo, issue_number: boardIssue });
              let body = board.data.body || '';
              const start = '<!-- agent-file-conflicts:start -->';
              const end = '<!-- agent-file-conflicts:end -->';
              const block = [
                '## Cross-issue file ownership',
                '',
                'Earlier active claims and legacy PRs own their declared files first. A later claim listed below must narrow its scope or wait for release before implementation or merge.',
                '',
                start,
                table,
                end,
              ].join('\n');

              if (body.includes(start) && body.includes(end)) {
                body = body.replace(new RegExp(`${start}[\\s\\S]*?${end}`), `${start}\n${table}\n${end}`);
              } else {
                const anchor = '<!-- agent-work-board:managed-end -->';
                if (!body.includes(anchor)) throw new Error(`Board issue #${boardIssue} is missing ${anchor}.`);
                body = body.replace(anchor, `${anchor}\n\n${block}`);
              }

              if (body !== (board.data.body || '')) {
                await github.rest.issues.update({ owner, repo, issue_number: boardIssue, body });
              }
            }

            async function clearStaleLabels(activeRows) {
              const activeNumbers = new Set(activeRows.map(row => row.issue.number));
              for (const state of ['open', 'closed']) {
                const labelled = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state,
                  labels: conflictLabel,
                  per_page: 100,
                });
                for (const issue of labelled) {
                  if (issue.pull_request || activeNumbers.has(issue.number)) continue;
                  await removeConflictLabel(issue);
                }
              }
            }

            function prClaimIssue(pr) {
              const match = (pr.body || '').match(/^Agent-Claim:\s*#(\d+)\s*$/mi);
              return match ? Number(match[1]) : null;
            }

            runSelfTests();
            await ensureConflictLabel();

            const extraIssueNumbers = [];
            if (context.eventName === 'issue_comment' || context.eventName === 'issues') {
              extraIssueNumbers.push(context.payload.issue?.number);
            }
            if (context.eventName === 'pull_request') {
              extraIssueNumbers.push(prClaimIssue(context.payload.pull_request));
            }

            const rows = annotateConflicts(
              await collectClaimRows(extraIssueNumbers.filter(Boolean)),
              await collectLegacyRows(),
            );

            for (const row of rows) {
              if (row.fileConflicts.length) await addConflictLabel(row);
              else await removeConflictLabel(row.issue);
              await upsertConflictStatus(row);
            }
            await clearStaleLabels(rows);
            await updateBoard(rows);

            const blocked = rows.filter(row => row.fileConflicts.length);
            core.summary
              .addHeading('Cross-issue file ownership')
              .addRaw(`${rows.length} active claim(s) checked; ${blocked.length} later claim(s) currently blocked by earlier file ownership.`)
              .write();

            if (context.eventName !== 'pull_request' || context.payload.action === 'closed') return;

            const pr = context.payload.pull_request;
            if (pr.number <= legacyPrMax) return;

            const issueNumber = prClaimIssue(pr);
            if (!issueNumber) return;

            const current = rows.find(row => row.issue.number === issueNumber);
            if (!current || !current.fileConflicts.length) return;

            const details = current.fileConflicts
              .map(conflict => `${conflict.blocker} on ${conflict.paths.join(', ')}`)
              .join('; ');
            core.setFailed(`Agent-Claim #${issueNumber} loses cross-issue file ownership to earlier work: ${details}. Narrow the claim or wait for release before this PR can proceed.`);