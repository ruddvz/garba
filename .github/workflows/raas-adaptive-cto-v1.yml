name: RAAS adaptive CTO v1

on:
  pull_request:
    paths:
      - '.raas/ADAPTIVE-CTO.md'
      - '.raas/adaptive-cto.json'
      - 'scripts/raas-adaptive.mjs'
      - 'scripts/raas-adaptive.test.mjs'
      - 'scripts/validate-repository-structure.mjs'
      - '.github/workflows/raas-adaptive-cto-v1.yml'

permissions:
  contents: write

jobs:
  adaptive-regression:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair release speech-act classification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'scripts/raas-adaptive.mjs'
          const source = fs.readFileSync(file, 'utf8')
          const before = "  if (deliveryStop === 'production-verification' || includesAny(text, ['deploy', 'release'])) return 'release'"
          const after = "  if (deliveryStop === 'production-verification' || routeIds(task).includes('deployment') || includesAny(text, ['deploy it', 'deploy this', 'go live', 'ship it live'])) return 'release'"
          if (!source.includes(before)) {
            throw new Error('Expected release classifier line was not found; refusing blind rewrite')
          }
          fs.writeFileSync(file, source.replace(before, after))
          NODE

      - name: Check adaptive modules
        run: |
          node --check scripts/raas-adaptive.mjs
          node --check scripts/raas-adaptive.test.mjs

      - name: Run adaptive CTO regression suite
        run: node scripts/raas-adaptive.test.mjs

      - name: Commit proven classifier repair
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/raas-adaptive.mjs
          if git diff --cached --quiet; then
            echo 'No classifier repair remained to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(RAAS): distinguish release noun from deploy action'
          git push origin HEAD:${{ github.head_ref }}
