name: Desktop WebKit Search hit-test diagnostic

on:
  pull_request:
    paths:
      - '.github/browser/webkit-search-hit-test-diagnostic.mjs'
      - '.github/workflows/webkit-search-hit-test-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-search-hit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build catalogue data
        run: npm run catalogue

      - name: Prepare focused production-equivalent fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _webkit_hit_test
          mkdir -p _webkit_hit_test
          cp \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _webkit_hit_test/
          cp -R assets data _webkit_hit_test/

          # Match production packaging for the player payload and stylesheet order.
          cat app.js assets/runtime/seek-state.js > _webkit_hit_test/app.js
          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _webkit_hit_test/styles.css

          test -s _webkit_hit_test/index.html
          test -s _webkit_hit_test/app.js
          test -s _webkit_hit_test/styles.css
          test -s _webkit_hit_test/data/songs.json
          grep -q 'id="searchButton"' _webkit_hit_test/index.html
          grep -q 'id="sheetClose"' _webkit_hit_test/index.html
          grep -q 'id="searchInput"' _webkit_hit_test/index.html

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Start focused fixture
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory _webkit_hit_test >/tmp/playgarba-webkit-hit-test.log 2>&1 &
          echo $! > /tmp/playgarba-webkit-hit-test.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/playgarba-webkit-hit-test.log
          exit 1

      - name: Capture hit-test evidence
        run: node .github/browser/webkit-search-hit-test-diagnostic.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webkit-search-hit-test-diagnostic
          path: |
            webkit-search-hit-test-diagnostic.json
            /tmp/playgarba-webkit-hit-test.log
          if-no-files-found: warn
          retention-days: 7
