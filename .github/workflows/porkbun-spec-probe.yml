name: Temporary Porkbun API schema probe

on:
  push:
    branches: [codex/porkbun-spec-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print relevant Porkbun v3.19 schemas
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://porkbun.com/api/json/v3/spec -o /tmp/spec.json
          echo '=== matching API paths ==='
          jq -r '.paths | keys[] | select(test("fix|hosting|forward"; "i"))' /tmp/spec.json
          echo '=== AddUrlForwardRequest ==='
          jq '.components.schemas.AddUrlForwardRequest' /tmp/spec.json
          echo '=== GetUrlForwardingResponse ==='
          jq '.components.schemas.GetUrlForwardingResponse' /tmp/spec.json
          echo '=== hosting get response sample ==='
          jq '.paths["/hosting/get/{domain}"].get.responses["200"]' /tmp/spec.json
