name: Apply Release Presentation Roles

on:
  push:
    branches:
      - codex/garba-nonstop-presentation-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/garba-nonstop-presentation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply presentation roles
        run: node scripts/lib/apply-release-presentation-roles.mjs
      - name: Commit migrated metadata
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No presentation migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogue/releases data/discovery/sets/sets-01.json
          git commit -m 'Link duplicate and continuous releases to canonical presentation'
          git push origin HEAD:codex/garba-nonstop-presentation-v2
