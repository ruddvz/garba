name: Temporary Vercel public-site probe

on:
  push:
    branches: [codex/porkbun-spec-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Vercel production alias
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://playgarba-public-pvr6675-3816s-projects.vercel.app'
          for path in '/' '/styles.css' '/assets/icon.svg'; do
            echo "=== ${path} (no redirect follow) ==="
            curl --silent --show-error --max-time 15 --output /tmp/body --dump-header /tmp/headers "${BASE}${path}" || true
            cat /tmp/headers
            echo '--- title/snippet ---'
            grep -ioE '<title>[^<]*</title>' /tmp/body | head -3 || true
            head -c 500 /tmp/body | tr '\n' ' ' || true
            echo
            echo
          done
