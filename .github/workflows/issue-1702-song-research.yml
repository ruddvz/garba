name: Issue 1702 song research (temporary)

on:
  push:
    branches: [claude/song-links-1702]
    paths:
      - '.github/issue-1702-song-research.mjs'
      - '.github/workflows/issue-1702-song-research.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Search YouTube for official album tracks
        env:
          ONLY: sanedo-sanedo-2007,jay-ho-vol9-2002,dhara-rankar-2025,saybo-nonstop-garba-2022
        run: node .github/issue-1702-song-research.mjs
      - name: Keep the results on the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/issue-1702-results.json
          git commit -m 'research(#1702): official YouTube album track candidates' || exit 0
          git push
