name: Migrate Garba Genre Taxonomy

on:
  push:
    branches:
      - codex/garba-genre-audit-259

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: codex/garba-genre-audit-259
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrate mismatched taxonomy
        run: node scripts/lib/migrate-genre-taxonomy-styles.mjs

      - name: Index secondary taxonomy in product search
        run: node scripts/lib/finalize-genre-taxonomy-search.mjs

      - name: Commit migrated catalogue and search UX
        run: |
          set -euo pipefail
          if git diff --quiet -- data/catalogue/songs app.js src/catalogue/catalogue.js; then
            echo 'No taxonomy migration or search changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogue/songs app.js src/catalogue/catalogue.js
          git commit -m 'Index secondary Garba taxonomy in player and Explore'
          git push origin HEAD:codex/garba-genre-audit-259
