name: Issue 1113 guarded De Taali apply

on:
  push:
    branches:
      - catalogue/issue-1113-de-taali-complete

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded catalogue reconciliation
        run: node .github/issue-1113-apply.cjs

      - name: Run focused catalogue validation
        run: |
          npm run catalogue
          npm run catalogue:metadata:audit
          npm run presentation:validate
          npm run release:context:validate
          node scripts/validate-runtime-song-routes.mjs

      - name: Run full repository validation
        run: npm run check

      - name: Remove temporary helpers and commit validated fix
        shell: bash
        run: |
          rm .github/workflows/issue-1113-apply.yml .github/issue-1113-apply.cjs
          expected=".github/issue-1113-apply.cjs
.github/workflows/issue-1113-apply.yml
data/catalogue/index.json
data/catalogue/releases/releases-01.json
data/catalogue/songs/songs-02.json
data/catalogue/songs/songs-03.json
data/playback-sources-de-taali-exact.json"
          actual="$(git status --short | awk '{print $2}' | sort)"
          printf 'Changed paths before commit:\n%s\n' "$actual"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected final changed-path set' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/issue-1113-apply.cjs .github/workflows/issue-1113-apply.yml data/catalogue/index.json data/catalogue/releases/releases-01.json data/catalogue/songs/songs-02.json data/catalogue/songs/songs-03.json data/playback-sources-de-taali-exact.json
          git commit -m 'fix: complete De Taali 1999 catalogue import'
          git push origin HEAD:catalogue/issue-1113-de-taali-complete
