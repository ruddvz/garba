name: Apply issue 405 Explore truth recovery

on:
  push:
    branches:
      - fix/issue-405-explore-truth-current-main-v2
    paths:
      - .github/workflows/apply-issue-405-explore-truth-v2.yml
      - scripts/tmp-apply-issue-405.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-405-explore-truth-current-main-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact source patch
        run: python scripts/tmp-apply-issue-405.py
      - name: Validate recovered Explore truth contract
        run: |
          node --check src/catalogue/catalogue.js
          node scripts/lib/validate-explore-detail-refinement.mjs
          npm run check
      - name: Remove temporary tooling and commit product files only
        run: |
          rm .github/workflows/apply-issue-405-explore-truth-v2.yml scripts/tmp-apply-issue-405.py
          changed="$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')"
          test "$changed" = ".github/workflows/apply-issue-405-explore-truth-v2.yml scripts/lib/validate-explore-detail-refinement.mjs scripts/tmp-apply-issue-405.py src/catalogue/catalogue.js "
          git config user.name "PlayGarba recovery bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows/apply-issue-405-explore-truth-v2.yml scripts/tmp-apply-issue-405.py src/catalogue/catalogue.js scripts/lib/validate-explore-detail-refinement.mjs
          git commit -m "Fix Explore truthful tracklists and artist matching"
          git push origin HEAD:fix/issue-405-explore-truth-current-main-v2
