name: Verify PlayGarba public website

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify apex serves current public design
        id: apex
        shell: bash
        run: |
          set -euo pipefail
          html=''
          for attempt in 1 2 3 4; do
            if html="$(curl -fsSL --max-time 15 https://playgarba.com/)"; then
              if grep -Fq 'All the Garba' <<<"$html" && grep -Fq 'Choose a sound.' <<<"$html" && grep -Fq 'What is Garba?' <<<"$html" && grep -Fq 'Useful links.' <<<"$html"; then
                echo 'playgarba.com is serving the current public website.'
                exit 0
              fi
            fi
            [ "$attempt" -lt 4 ] && sleep 5
          done
          echo 'playgarba.com is reachable but is not serving the current website branch.' >&2
          exit 1

      - name: Verify www redirects to apex
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-time 15 https://www.playgarba.com/)"
          grep -Eqi '^location: https://playgarba\.com/?\r?$' <<<"$headers" || {
            echo 'www.playgarba.com is not redirecting to the canonical apex.' >&2
            exit 1
          }
          echo 'www.playgarba.com redirects to the canonical apex.'
