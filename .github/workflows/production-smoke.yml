name: Temporary production smoke test

on:
  push:
    branches: [codex/prod-smoke-bebe]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PlayGarba production
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          dig +short CNAME live.playgarba.com
          test "$(dig +short CNAME live.playgarba.com | head -1)" = 'ruddvz.github.io.'

          echo '=== HTTPS statuses ==='
          ROOT_CODE="$(curl -sS -o /tmp/root.html -w '%{http_code}' https://live.playgarba.com/)"
          CAT_CODE="$(curl -sS -o /tmp/catalogue.html -w '%{http_code}' https://live.playgarba.com/catalogue/)"
          APP_CODE="$(curl -sS -o /tmp/app.js -w '%{http_code}' https://live.playgarba.com/app.js)"
          CSS_CODE="$(curl -sS -o /tmp/styles.css -w '%{http_code}' https://live.playgarba.com/styles.css)"
          SONGS_CODE="$(curl -sS -o /tmp/songs.json -w '%{http_code}' https://live.playgarba.com/data/songs.json)"
          ROBOTS_CODE="$(curl -sS -o /tmp/robots.txt -w '%{http_code}' https://live.playgarba.com/robots.txt)"
          SITEMAP_CODE="$(curl -sS -o /tmp/sitemap.xml -w '%{http_code}' https://live.playgarba.com/sitemap.xml)"
          printf 'root=%s catalogue=%s app=%s css=%s songs=%s robots=%s sitemap=%s\n' "$ROOT_CODE" "$CAT_CODE" "$APP_CODE" "$CSS_CODE" "$SONGS_CODE" "$ROBOTS_CODE" "$SITEMAP_CODE"
          test "$ROOT_CODE" = 200
          test "$CAT_CODE" = 200
          test "$APP_CODE" = 200
          test "$CSS_CODE" = 200
          test "$SONGS_CODE" = 200
          test "$ROBOTS_CODE" = 200
          test "$SITEMAP_CODE" = 200

          echo '=== Homepage contract ==='
          grep -F 'href="./catalogue/"' /tmp/root.html
          grep -F '<span>Explore</span>' /tmp/root.html
          grep -F 'aria-label="Explore PlayGarba catalogue"' /tmp/root.html
          ! grep -E 'id="browseButton"[^>]*aria-controls' /tmp/root.html
          ! grep -F '<span>Browse songs</span>' /tmp/root.html
          grep -F '<link rel="canonical" href="https://live.playgarba.com/"' /tmp/root.html
          grep -F 'https://live.playgarba.com/assets/social/garba-og-card.png?v=20260908-2' /tmp/root.html

          echo '=== Catalogue contract ==='
          grep -F '<link rel="canonical" href="https://live.playgarba.com/catalogue/"' /tmp/catalogue.html
          grep -F 'id="catalogueSongList"' /tmp/catalogue.html
          grep -F 'assets/runtime/explore-search.js' /tmp/catalogue.html

          echo '=== Runtime guard ==='
          grep -F "els.browseButton?.tagName !== 'A'" /tmp/app.js
          grep -F "els.browseButton?.hasAttribute('aria-controls')" /tmp/app.js

          echo '=== Crawl contract ==='
          grep -F 'Sitemap: https://live.playgarba.com/sitemap.xml' /tmp/robots.txt
          grep -F '<loc>https://live.playgarba.com/</loc>' /tmp/sitemap.xml
          grep -F '<loc>https://live.playgarba.com/catalogue/</loc>' /tmp/sitemap.xml

          echo '=== External apex state (diagnostic only) ==='
          printf 'apex_https=%s\n' "$(curl -sS -o /dev/null -w '%{http_code}' https://playgarba.com/ || true)"
          printf 'www_https=%s\n' "$(curl -sS -o /dev/null -w '%{http_code}' https://www.playgarba.com/ || true)"

          echo 'PRODUCTION_SMOKE_OK'
