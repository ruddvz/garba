name: Temporary listening contract update

on:
  push:
    branches:
      - codex/listening-flow-287

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/listening-flow-287
      - name: Update runtime packaging assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-runtime-packaging.mjs')
          text = path.read_text()
          old_heading = "  \"heading.textContent = 'Your listening';\","
          new_heading = "  \"heading.textContent = 'My Garba';\","
          old_saved = "  \"kicker.textContent = kind === 'continue' ? 'Continue listening' : 'Favourite';\","
          new_saved = "  \"kicker.textContent = kind === 'continue' ? 'Continue listening' : 'Saved';\","
          if old_heading in text:
              text = text.replace(old_heading, new_heading, 1)
          if old_saved in text:
              text = text.replace(old_saved, new_saved, 1)
          if new_heading not in text or new_saved not in text:
              raise SystemExit('Updated listening-library contract markers are missing')
          path.write_text(text)
          PY
      - name: Commit validation contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-runtime-packaging.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align runtime packaging with My Garba"
          git push origin HEAD:codex/listening-flow-287
