name: Agent claim hygiene

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-claim-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile claims needing owner review
        uses: actions/github-script@v7
        env:
          BOARD_ISSUE: "364"
          REVIEW_AFTER_HOURS: "2"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const boardIssue = Number(process.env.BOARD_ISSUE);
            const reviewAfterMs = Number(process.env.REVIEW_AFTER_HOURS) * 60 * 60 * 1000;
            const reviewLabel = 'agent:claim-review';

            const claimRe = /<!--\s*agent-claim\s*\n([\s\S]*?)-->/i;
            const releaseRe = /<!--\s*agent-release\s*\n([\s\S]*?)-->/i;
            const overrideRe = /<!--\s*agent-claim-override\s*\n([\s\S]*?)-->/i;
            const heartbeatRe = /<!--\s*agent-heartbeat\s*\n([\s\S]*?)-->/i;

            if (context.eventName === 'issue_comment') {
              const body = context.payload.comment?.body || '';
              if (!claimRe.test(body) && !releaseRe.test(body) && !overrideRe.test(body) && !heartbeatRe.test(body)) return;
            }

            function field(block, name) {
              const match = block.match(new RegExp(`^${name}:\\s*(.+?)\\s*$`, 'mi'));
              return match ? match[1].trim() : '';
            }

            function commentTime(comment) {
              const value = Date.parse(comment.created_at || comment.updated_at || '');
              return Number.isFinite(value) ? value : 0;
            }

            function parseEvent(comment) {
              const body = comment.body || '';
              const override = body.match(overrideRe);
              if (override) {
                return {
                  type: 'override',
                  author: comment.user?.login || 'unknown',
                  commentId: comment.id,
                  timeMs: commentTime(comment),
                };
              }

              const release = body.match(releaseRe);
              if (release) {
                return {
                  type: 'release',
                  agent: field(release[1], 'agent'),
                  branch: field(release[1], 'branch'),
                  commentId: comment.id,
                  timeMs: commentTime(comment),
                };
              }

              const claim = body.match(claimRe);
              if (claim) {
                return {
                  type: 'claim',
                  agent: field(claim[1], 'agent'),
                  branch: field(claim[1], 'branch'),
                  scope: field(claim[1], 'scope'),
                  files: field(claim[1], 'files'),
                  commentId: comment.id,
                  timeMs: commentTime(comment),
                };
              }

              const heartbeat = body.match(heartbeatRe);
              if (heartbeat) {
                return {
                  type: 'heartbeat',
                  agent: field(heartbeat[1], 'agent'),
                  branch: field(heartbeat[1], 'branch'),
                  status: field(heartbeat[1], 'status'),
                  commentId: comment.id,
                  timeMs: commentTime(comment),
                };
              }

              return null;
            }

            function validClaim(event) {
              return event?.type === 'claim' && event.agent && event.branch && event.scope && event.files;
            }

            function validHeartbeat(event) {
              return event?.type === 'heartbeat' && event.agent && event.branch;
            }

            function sameOwner(a, b) {
              return Boolean(a && b && a.agent === b.agent && a.branch === b.branch);
            }

            function deriveState(comments) {
              let active = null;
              let activityMs = 0;
              let heartbeatStatus = '';

              for (const comment of [...comments].sort((a, b) => a.id - b.id)) {
                const event = parseEvent(comment);
                if (!event) continue;

                if (event.type === 'override') {
                  if (event.author === owner) {
                    active = null;
                    activityMs = 0;
                    heartbeatStatus = '';
                  }
                  continue;
                }

                if (event.type === 'release') {
                  if (active && sameOwner(active, event)) {
                    active = null;
                    activityMs = 0;
                    heartbeatStatus = '';
                  }
                  continue;
                }

                if (validClaim(event)) {
                  if (!active) {
                    active = { ...event, ownershipCommentId: event.commentId };
                    activityMs = event.timeMs;
                    heartbeatStatus = '';
                  } else if (sameOwner(active, event)) {
                    active = { ...event, ownershipCommentId: active.ownershipCommentId };
                    activityMs = event.timeMs;
                    heartbeatStatus = '';
                  }
                  continue;
                }

                if (validHeartbeat(event) && active && sameOwner(active, event)) {
                  activityMs = Math.max(activityMs, event.timeMs);
                  heartbeatStatus = event.status || '';
                }
              }

              return { active, activityMs, heartbeatStatus };
            }

            function normalizeFileToken(raw) {
              let token = String(raw || '').trim().replace(/^`+|`+$/g, '').replace(/^\.\//, '');
              token = token.replace(/^(?:expected|likely)\s+/i, '').trim();
              return token;
            }

            function concreteFilePatterns(raw) {
              return String(raw || '')
                .split(';')
                .map(normalizeFileToken)
                .filter(Boolean)
                .filter(token => !/^research-only\b/i.test(token))
                .filter(token => !/^(?:none|n\/a)$/i.test(token));
            }

            function hasConcreteFiles(raw) {
              return concreteFilePatterns(raw).length > 0;
            }

            function prClaimIssue(pr) {
              const match = (pr.body || '').match(/^Agent-Claim:\s*#(\d+)\s*$/mi);
              return match ? Number(match[1]) : null;
            }

            function prAgent(pr) {
              const match = (pr.body || '').match(/^Agent-ID:\s*(.+?)\s*$/mi);
              return match ? match[1].trim() : '';
            }

            function matchingOpenPr(row, pulls) {
              return pulls.find(pr =>
                pr.head?.ref === row.state.active.branch &&
                prClaimIssue(pr) === row.issue.number &&
                prAgent(pr) === row.state.active.agent
              ) || null;
            }

            function reviewDecision({ concrete, hasOpenPr, lastActivityMs, nowMs }) {
              if (!concrete || hasOpenPr) return { review: false, ageMs: Math.max(0, nowMs - lastActivityMs) };
              const ageMs = Math.max(0, nowMs - lastActivityMs);
              return { review: ageMs >= reviewAfterMs, ageMs };
            }

            function syntheticComment(id, body, login = 'agent', createdAt = '2026-09-08T12:00:00Z') {
              return { id, body, user: { login }, created_at: createdAt };
            }

            function claimBody(agent, branch, files) {
              return [
                '<!-- agent-claim',
                `agent: ${agent}`,
                `branch: ${branch}`,
                'scope: test scope',
                `files: ${files}`,
                '-->',
              ].join('\n');
            }

            function heartbeatBody(agent, branch, status = 'still active') {
              return [
                '<!-- agent-heartbeat',
                `agent: ${agent}`,
                `branch: ${branch}`,
                `status: ${status}`,
                '-->',
              ].join('\n');
            }

            function releaseBody(agent, branch) {
              return [
                '<!-- agent-release',
                `agent: ${agent}`,
                `branch: ${branch}`,
                '-->',
              ].join('\n');
            }

            function assert(condition, message) {
              if (!condition) throw new Error(`Agent claim hygiene self-test failed: ${message}`);
            }

            function runSelfTests() {
              const claim = syntheticComment(10, claimBody('agent/a', 'work/a', 'a.js'), 'agent', '2026-09-08T10:00:00Z');
              const heartbeat = syntheticComment(20, heartbeatBody('agent/a', 'work/a'), 'agent', '2026-09-08T11:30:00Z');
              const state = deriveState([claim, heartbeat]);
              assert(state.active?.ownershipCommentId === 10, 'heartbeat does not change ownership priority');
              assert(state.activityMs === Date.parse('2026-09-08T11:30:00Z'), 'matching heartbeat refreshes activity');

              const update = syntheticComment(30, claimBody('agent/a', 'work/a', 'a.js; b.js'), 'agent', '2026-09-08T11:45:00Z');
              const updated = deriveState([claim, update]);
              assert(updated.active?.ownershipCommentId === 10, 'same-owner claim update preserves ownership priority');
              assert(updated.activityMs === Date.parse('2026-09-08T11:45:00Z'), 'same-owner claim update refreshes activity');
              assert(updated.active?.files === 'a.js; b.js', 'same-owner claim update replaces visible files');

              assert(!hasConcreteFiles('research-only'), 'research-only reserves no files');
              assert(hasConcreteFiles('research-only until evidence; docs/a.md'), 'mixed claim with a concrete path is not exempt');

              const nowMs = Date.parse('2026-09-08T14:00:00Z');
              assert(reviewDecision({ concrete: true, hasOpenPr: true, lastActivityMs: Date.parse('2026-09-08T09:00:00Z'), nowMs }).review === false, 'open PR is never aged into review');
              assert(reviewDecision({ concrete: false, hasOpenPr: false, lastActivityMs: Date.parse('2026-09-08T09:00:00Z'), nowMs }).review === false, 'research-only is exempt');
              assert(reviewDecision({ concrete: true, hasOpenPr: false, lastActivityMs: Date.parse('2026-09-08T11:30:00Z'), nowMs }).review === true, 'aged concrete no-PR claim needs review');
              assert(reviewDecision({ concrete: true, hasOpenPr: false, lastActivityMs: Date.parse('2026-09-08T13:00:00Z'), nowMs }).review === false, 'recent heartbeat keeps claim fresh');

              const released = deriveState([claim, syntheticComment(40, releaseBody('agent/a', 'work/a'), 'agent', '2026-09-08T12:00:00Z')]);
              assert(!released.active, 'matching release clears ownership');

              const overridden = deriveState([
                claim,
                syntheticComment(50, '<!-- agent-claim-override\nreason: abandoned\n-->\nOVERRIDE', owner, '2026-09-08T12:00:00Z'),
              ]);
              assert(!overridden.active, 'repository owner override clears ownership');
            }

            async function listComments(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
            }

            function labelNames(issue) {
              return new Set((issue.labels || [])
                .map(label => typeof label === 'string' ? label : label?.name)
                .filter(Boolean));
            }

            async function ensureReviewLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: reviewLabel });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: reviewLabel,
                    color: 'D4A72C',
                    description: 'Concrete agent claim has no matching open PR and needs an owner activity/narrow/release review; ownership is not expired.',
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            async function addReviewLabel(issue) {
              if (labelNames(issue).has(reviewLabel)) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [reviewLabel] });
            }

            async function removeReviewLabel(issue) {
              if (!labelNames(issue).has(reviewLabel)) return;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: reviewLabel });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            async function collectRows(extraIssueNumbers = []) {
              const claimed = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: 'agent:claimed',
                per_page: 100,
              });

              const byNumber = new Map();
              for (const issue of claimed) {
                if (issue.pull_request || issue.number === boardIssue) continue;
                byNumber.set(issue.number, issue);
              }

              for (const issueNumber of extraIssueNumbers) {
                if (!issueNumber || issueNumber === boardIssue || byNumber.has(issueNumber)) continue;
                try {
                  const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
                  if (!issue.pull_request && issue.state === 'open') byNumber.set(issue.number, issue);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              const rows = [];
              for (const issue of byNumber.values()) {
                const comments = await listComments(issue.number);
                const state = deriveState(comments);
                if (state.active) rows.push({ issue, comments, state });
              }
              return rows;
            }

            async function branchActivityMs(branch) {
              try {
                const response = await github.rest.repos.getBranch({ owner, repo, branch });
                const commit = response.data.commit;
                const candidates = [
                  commit?.commit?.committer?.date,
                  commit?.commit?.author?.date,
                ].map(value => Date.parse(value || '')).filter(Number.isFinite);
                return candidates.length ? Math.max(...candidates) : 0;
              } catch (error) {
                if (error.status === 404) return 0;
                throw error;
              }
            }

            function formatAge(ageMs) {
              const hours = Math.floor(ageMs / (60 * 60 * 1000));
              const minutes = Math.floor((ageMs % (60 * 60 * 1000)) / (60 * 1000));
              return hours ? `${hours}h ${minutes}m` : `${minutes}m`;
            }

            function reviewStatus(row) {
              const lastIso = row.lastActivityMs ? new Date(row.lastActivityMs).toISOString() : 'unknown';
              return [
                '<!-- agent-claim-review-status -->',
                '### Claim hygiene',
                '',
                row.needsReview
                  ? '**Status:** Needs owner review'
                  : '**Status:** Clear',
                row.needsReview ? `- No matching open PR for \`${row.state.active.branch}\`.` : '',
                row.needsReview ? `- Last observed claim/heartbeat/branch activity: ${lastIso} (${formatAge(row.ageMs)} ago).` : '',
                '',
                row.needsReview
                  ? 'Ownership is unchanged. Open/update the matching PR, post an `agent-heartbeat`, narrow to `research-only` if this is evidence-only work, or release the lane if implementation stopped.'
                  : 'No claim-hygiene warning is active. This does not change the normal ownership/file-conflict rules.',
              ].filter(Boolean).join('\n');
            }

            async function upsertReviewStatus(row) {
              const existing = row.comments.find(comment =>
                comment.body?.includes('<!-- agent-claim-review-status -->') && comment.user?.type === 'Bot'
              );
              if (!row.needsReview && !existing) return;
              const wanted = reviewStatus(row);
              if (!existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: row.issue.number, body: wanted });
              } else if ((existing.body || '').trim() !== wanted.trim()) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: wanted });
              }
            }

            async function clearStaleLabels(reviewRows) {
              const reviewNumbers = new Set(reviewRows.map(row => row.issue.number));
              for (const state of ['open', 'closed']) {
                const labelled = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo,
                  state,
                  labels: reviewLabel,
                  per_page: 100,
                });
                for (const issue of labelled) {
                  if (issue.pull_request || reviewNumbers.has(issue.number)) continue;
                  await removeReviewLabel(issue);
                }
              }
            }

            function esc(value) {
              return String(value || '').replace(/\|/g, '\\|').replace(/\n/g, ' ');
            }

            function renderBoardBody(currentBody, table) {
              const start = '<!-- agent-claim-review:start -->';
              const end = '<!-- agent-claim-review:end -->';
              let body = currentBody || '';
              if (body.includes(start) && body.includes(end)) {
                return body.replace(new RegExp(`${start}[\\s\\S]*?${end}`), `${start}\n${table}\n${end}`);
              }

              const fileAnchor = '<!-- agent-file-conflicts:end -->';
              const managedAnchor = '<!-- agent-work-board:managed-end -->';
              const anchor = body.includes(fileAnchor) ? fileAnchor : managedAnchor;
              if (!body.includes(anchor)) throw new Error(`Board issue #${boardIssue} is missing a known coordination anchor.`);
              const block = [
                anchor,
                '',
                '## Claims needing review',
                '',
                'These warnings never expire ownership automatically. They surface concrete file claims with no matching open PR and no recent claim, heartbeat or branch activity so the owner can confirm, narrow or release them.',
                '',
                start,
                table,
                end,
              ].join('\n');
              return body.replace(anchor, block);
            }

            async function updateBoard(reviewRows) {
              const table = reviewRows.length
                ? [
                    '| Issue | Agent | Branch | Last activity | Review reason |',
                    '| --- | --- | --- | --- | --- |',
                    ...reviewRows.map(row =>
                      `| #${row.issue.number} | \`${esc(row.state.active.agent)}\` | \`${esc(row.state.active.branch)}\` | ${row.lastActivityMs ? new Date(row.lastActivityMs).toISOString() : 'unknown'} | No matching open PR; ${formatAge(row.ageMs)} without observed activity |`
                    ),
                  ].join('\n')
                : '_No concrete active claims currently need hygiene review._';

              const start = '<!-- agent-claim-review:start -->';
              const end = '<!-- agent-claim-review:end -->';
              const expectedBlock = `${start}\n${table}\n${end}`;

              await new Promise(resolve => setTimeout(resolve, 500));
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                const board = await github.rest.issues.get({ owner, repo, issue_number: boardIssue });
                const current = board.data.body || '';
                if (current.includes(expectedBlock)) return;
                const wanted = renderBoardBody(current, table);
                if (wanted !== current) {
                  await github.rest.issues.update({ owner, repo, issue_number: boardIssue, body: wanted });
                }
                await new Promise(resolve => setTimeout(resolve, attempt * 400));
                const verify = await github.rest.issues.get({ owner, repo, issue_number: boardIssue });
                if ((verify.data.body || '').includes(expectedBlock)) return;
              }
              throw new Error(`Could not persist claim hygiene section on board #${boardIssue} after retries.`);
            }

            runSelfTests();
            await ensureReviewLabel();

            const extraIssueNumbers = [];
            if (context.eventName === 'issue_comment' || context.eventName === 'issues') {
              extraIssueNumbers.push(context.payload.issue?.number);
            }
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              extraIssueNumbers.push(prClaimIssue(pr));
            }

            const rows = await collectRows(extraIssueNumbers.filter(Boolean));
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const nowMs = Date.now();

            for (const row of rows) {
              const concrete = hasConcreteFiles(row.state.active.files);
              const openPr = matchingOpenPr(row, openPulls);
              const branchMs = openPr ? 0 : await branchActivityMs(row.state.active.branch);
              row.lastActivityMs = Math.max(row.state.activityMs || 0, branchMs || 0);
              const decision = reviewDecision({
                concrete,
                hasOpenPr: Boolean(openPr),
                lastActivityMs: row.lastActivityMs,
                nowMs,
              });
              row.needsReview = decision.review;
              row.ageMs = decision.ageMs;
              row.openPr = openPr;

              if (row.needsReview) await addReviewLabel(row.issue);
              else await removeReviewLabel(row.issue);
              await upsertReviewStatus(row);
            }

            const reviewRows = rows
              .filter(row => row.needsReview)
              .sort((a, b) => b.ageMs - a.ageMs || a.issue.number - b.issue.number);

            await clearStaleLabels(reviewRows);
            await updateBoard(reviewRows);

            core.summary
              .addHeading('Agent claim hygiene')
              .addRaw(`${rows.length} active claim(s) checked; ${reviewRows.length} concrete no-PR claim(s) need owner review. No ownership was released or expired.`)
              .write();