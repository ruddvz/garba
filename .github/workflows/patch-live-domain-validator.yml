name: Patch live-domain validator

on:
  push:
    branches: [codex/live-domain-source-of-truth]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/live-domain-source-of-truth
      - name: Align repository validator with configured listening origin
        shell: bash
        run: |
          sed -i 's#https://playgarba\.com#https://live.playgarba.com#g; s#CNAME must be playgarba\.com#CNAME must be live.playgarba.com#g; s#cname !== '\''playgarba\.com'\''#cname !== '\''live.playgarba.com'\''#g; s#= '\''playgarba\.com'\''#= '\''live.playgarba.com'\''#g' scripts/validate-repository-structure.mjs
          git diff --check
          git diff -- scripts/validate-repository-structure.mjs
      - name: Commit validator update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-repository-structure.mjs
          git commit -m 'Validate live PlayGarba source domain'
          git push origin HEAD:codex/live-domain-source-of-truth
