name: Issue 1595 apply prepared search index

on:
  push:
    branches:
      - perf/issue-1595-player-search-index
    paths:
      - '.github/workflows/issue-1595-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/issue-1595-player-search-index
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply exact bounded edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after, label) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`${label}: expected source block not found in ${path}`);
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`${label}: source block is not unique in ${path}`);
            fs.writeFileSync(path, source.slice(0, first) + after + source.slice(first + before.length));
          }

          replaceOnce(
            'app.js',
            "import { normalizeSearchText, rankSearchRecords } from './assets/runtime/search-core.js';",
            "import { normalizeSearchText, prepareSearchRecord, rankPreparedSearchRecords } from './assets/runtime/search-core.js';",
            'player shared-search import',
          );

          replaceOnce(
            'app.js',
            "const SEARCH_RESULT_LIMIT = 160;\n",
            "const SEARCH_RESULT_LIMIT = 160;\nlet playerSearchEntries = [];\nlet playerSearchEntryBySong = new WeakMap();\n",
            'player search index state',
          );

          replaceOnce(
            'app.js',
            `function rankPlayerSongs(songs, query) {\n  return rankSearchRecords(songs.map(playerSearchRecord), query)\n    .map(({ record }) => record.song);\n}`,
            `function rebuildPlayerSearchIndex(songs = state.songs) {\n  const entries = [];\n  const bySong = new WeakMap();\n  for (const song of songs) {\n    const entry = prepareSearchRecord(playerSearchRecord(song));\n    entries.push(entry);\n    bySong.set(song, entry);\n  }\n  playerSearchEntries = entries;\n  playerSearchEntryBySong = bySong;\n}\n\nfunction preparedPlayerSearchRecord(song) {\n  let entry = playerSearchEntryBySong.get(song);\n  if (entry) return entry;\n  entry = prepareSearchRecord(playerSearchRecord(song));\n  playerSearchEntryBySong.set(song, entry);\n  return entry;\n}\n\nfunction rankPlayerSongs(songs, query) {\n  const entries = songs === state.songs\n    ? playerSearchEntries\n    : songs.map(preparedPlayerSearchRecord);\n  return rankPreparedSearchRecords(entries, query)\n    .map(({ record }) => record.song);\n}`,
            'player prepared search ranking',
          );

          replaceOnce(
            'app.js',
            `    state.genres = next.genres;\n    state.songs = next.songs;\n    state.presentationRedirects = next.presentationRedirects;`,
            `    state.genres = next.genres;\n    state.songs = next.songs;\n    rebuildPlayerSearchIndex(state.songs);\n    state.presentationRedirects = next.presentationRedirects;`,
            'refresh catalogue search index rebuild',
          );

          replaceOnce(
            'app.js',
            `    state.genres = catalogue.genres;\n    state.songs = catalogue.songs;\n    state.presentationRedirects = catalogue.presentationRedirects;`,
            `    state.genres = catalogue.genres;\n    state.songs = catalogue.songs;\n    rebuildPlayerSearchIndex(state.songs);\n    state.presentationRedirects = catalogue.presentationRedirects;`,
            'initial catalogue search index rebuild',
          );

          const searchMarker = `/**\n * Return ranked wrappers around the original records. The input array and records are\n * never sorted or mutated in place.\n */\nexport function rankSearchRecords(records, query) {`;
          replaceOnce(
            'assets/runtime/search-core.js',
            searchMarker,
            `/**\n * Prepare a stable search document once for callers that keep record identity stable\n * across repeated queries. The original record is retained only as the result payload.\n */\nexport function prepareSearchRecord(record) {\n  return { record, document: createSearchDocument(record) };\n}\n\nexport function prepareSearchRecords(records) {\n  if (!Array.isArray(records)) return [];\n  return records.map(prepareSearchRecord);\n}\n\n/**\n * Rank records whose normalized search documents were prepared earlier. Relevance,\n * query normalization and deterministic tie breaks are identical to rankSearchRecords.\n */\nexport function rankPreparedSearchRecords(preparedRecords, query) {\n  if (!Array.isArray(preparedRecords)) return [];\n  const preparedVariants = prepareQueryVariants(query);\n  if (!preparedVariants.length) return [];\n\n  const ranked = [];\n  for (const entry of preparedRecords) {\n    if (!entry?.document) continue;\n    const result = scorePreparedDocument(entry.document, preparedVariants);\n    if (result) ranked.push({ record: entry.record, ...result });\n  }\n  return ranked.sort(compareSearchResults);\n}\n\n/**\n * Return ranked wrappers around the original records. The input array and records are\n * never sorted or mutated in place.\n */\nexport function rankSearchRecords(records, query) {`,
            'shared prepared search API',
          );

          replaceOnce(
            'scripts/lib/test-search-core.mjs',
            `  normalizeSearchText,\n  normalizeSearchVariants,\n  rankSearchRecords,\n  scoreSearchRecord,`,
            `  normalizeSearchText,\n  normalizeSearchVariants,\n  prepareSearchRecords,\n  rankPreparedSearchRecords,\n  rankSearchRecords,\n  scoreSearchRecord,`,
            'search-core test imports',
          );

          replaceOnce(
            'scripts/lib/test-search-core.mjs',
            `// Same-title records keep distinct identity and receive a deterministic canonical-ID tie break.`,
            `// Prepared documents must preserve ordinary ranking truth across reviewed aliases, Gujarati,\n// Latin diacritics, taxonomy/release context and the bounded Latin typo fallback.\nconst preparedEquivalence = [\n  { id: 'prepared-title', title: 'Raas', artist: 'Singer' },\n  { id: 'prepared-alias', title: 'Festival Set', titleAliases: ['Raas'], artist: 'Singer' },\n  { id: 'prepared-gujarati', title: 'માડી તારું કંકુ ખર્યું', artist: 'Singer' },\n  { id: 'prepared-diacritic', title: 'Gītā Garbā', artist: 'Singer' },\n  { id: 'prepared-typo', title: 'Garba', artist: 'Singer' },\n  { id: 'prepared-taxonomy', title: 'Other', taxonomyTerms: ['Dandiya'] },\n  { id: 'prepared-release', title: 'Other', releaseTerms: ['Archive Collection'] },\n];\nconst preparedIndex = prepareSearchRecords(preparedEquivalence);\nfor (const query of ['raas', 'માડી તારું', 'gita garba', 'garva', 'dandiya', 'archive collection']) {\n  assert.deepEqual(\n    rankPreparedSearchRecords(preparedIndex, query).map(({ record, score, matchedBy }) => ({ id: record.id, score, matchedBy })),\n    rankSearchRecords(preparedEquivalence, query).map(({ record, score, matchedBy }) => ({ id: record.id, score, matchedBy })),\n    'Prepared ranking must match ordinary ranking for ' + query,\n  );\n}\n\n// Same-title records keep distinct identity and receive a deterministic canonical-ID tie break.`,
            'prepared search equivalence fixtures',
          );

          replaceOnce(
            'scripts/lib/validate-sheet-startup.mjs',
            `assert.match(app, /import \\{ normalizeSearchText, rankSearchRecords \\} from '\\.\\/assets\\/runtime\\/search-core\\.js';/, 'Player search must consume the shared search core');\nassert.match(app, /function playerSearchRecord\\(song\\)[\\s\\S]*?titleAliases: song\\.aliases[\\s\\S]*?artistAliases: song\\.artistAliases[\\s\\S]*?taxonomyTerms:/, 'Player search adapter must expose only reviewed catalogue identity fields');\nassert.match(app, /function rankPlayerSongs\\(songs, query\\)[\\s\\S]*?rankSearchRecords\\(songs\\.map\\(playerSearchRecord\\), query\\)/, 'Player results must use shared relevance ranking');`,
            `assert.match(app, /import \\{ normalizeSearchText, prepareSearchRecord, rankPreparedSearchRecords \\} from '\\.\\/assets\\/runtime\\/search-core\\.js';/, 'Player search must consume the shared prepared-search core');\nassert.match(app, /function playerSearchRecord\\(song\\)[\\s\\S]*?titleAliases: song\\.aliases[\\s\\S]*?artistAliases: song\\.artistAliases[\\s\\S]*?taxonomyTerms:/, 'Player search adapter must expose only reviewed catalogue identity fields');\nassert.match(app, /function rebuildPlayerSearchIndex\\(songs = state\\.songs\\)[\\s\\S]*?prepareSearchRecord\\(playerSearchRecord\\(song\\)\\)[\\s\\S]*?playerSearchEntries = entries/, 'Player must prepare stable search documents when the catalogue changes');\nassert.match(app, /function rankPlayerSongs\\(songs, query\\)[\\s\\S]*?songs === state\\.songs[\\s\\S]*?rankPreparedSearchRecords\\(entries, query\\)/, 'Player results must rank the prepared shared search index instead of rebuilding normalized documents per query');\nassert.match(app, /state\\.songs = next\\.songs;[\\s\\S]*?rebuildPlayerSearchIndex\\(state\\.songs\\);[\\s\\S]*?state\\.presentationRedirects = next\\.presentationRedirects;/, 'Catalogue refresh must rebuild the prepared player search index');\nassert.match(app, /state\\.songs = catalogue\\.songs;[\\s\\S]*?rebuildPlayerSearchIndex\\(state\\.songs\\);[\\s\\S]*?state\\.presentationRedirects = catalogue\\.presentationRedirects;/, 'Initial catalogue load must build the prepared player search index');`,
            'player prepared-search static validation',
          );
          NODE

      - name: Run focused validation
        run: |
          node scripts/lib/test-search-core.mjs
          node scripts/lib/validate-sheet-startup.mjs
          npm run check

      - name: Commit bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js assets/runtime/search-core.js scripts/lib/validate-sheet-startup.mjs scripts/lib/test-search-core.mjs
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'perf(search): prebuild player search documents'
          git push origin HEAD:perf/issue-1595-player-search-index
