name: Issue 450 final performance measurement

on:
  push:
    branches:
      - research/issue-450-final-measurement
    paths:
      - '.github/workflows/issue-450-final-measurement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install fixture renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin icoutils

      - name: Build full catalogue
        run: npm run catalogue

      - name: Prepare production-equivalent fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _perf
          mkdir -p _perf/catalogue _perf/explore

          cp \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _perf/
          cp -R assets data _perf/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _perf/catalogue/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _perf/explore/

          cat app.js assets/runtime/seek-state.js > _perf/app.js
          grep -q 'GARBA_SEEK_STATE_RUNTIME' _perf/app.js

          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _perf/styles.css
          ! grep -q '@import' _perf/styles.css

          mkdir -p _perf/assets/icons
          rsvg-convert -w 16 -h 16 assets/icons/icon.svg -o _perf/assets/icons/favicon-16.png
          rsvg-convert -w 32 -h 32 assets/icons/icon.svg -o _perf/assets/icons/favicon-32.png
          rsvg-convert -w 48 -h 48 assets/icons/icon.svg -o _perf/assets/icons/favicon-48.png
          rsvg-convert -w 152 -h 152 assets/icons/icon.svg -o _perf/assets/icons/apple-touch-icon-152.png
          rsvg-convert -w 167 -h 167 assets/icons/icon.svg -o _perf/assets/icons/apple-touch-icon-167.png
          rsvg-convert -w 180 -h 180 assets/icons/icon.svg -o _perf/assets/icons/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 assets/icons/icon.svg -o _perf/assets/icons/icon-192.png
          rsvg-convert -w 512 -h 512 assets/icons/icon.svg -o _perf/assets/icons/icon-512.png
          rsvg-convert -w 150 -h 150 assets/icons/icon.svg -o _perf/assets/icons/mstile-150x150.png
          rsvg-convert -w 310 -h 310 assets/icons/icon.svg -o _perf/assets/icons/mstile-310x310.png
          rsvg-convert -w 192 -h 192 assets/icons/maskable.svg -o _perf/assets/icons/maskable-192.png
          rsvg-convert -w 512 -h 512 assets/icons/maskable.svg -o _perf/assets/icons/maskable-512.png
          icotool -c -o _perf/favicon.ico \
            _perf/assets/icons/favicon-16.png \
            _perf/assets/icons/favicon-32.png \
            _perf/assets/icons/favicon-48.png

          PACK=''
          if [ -f assets/backgrounds/garba15-2048-q90.zip ]; then
            PACK='assets/backgrounds/garba15-2048-q90.zip'
          elif [ -f assets/backgrounds/garba15-2k.zip ]; then
            PACK='assets/backgrounds/garba15-2k.zip'
          elif [ -f assets/backgrounds/garba15-2k-q82.zip ]; then
            PACK='assets/backgrounds/garba15-2k-q82.zip'
          fi
          test -n "$PACK"
          rm -rf _perf/assets/backgrounds/library
          mkdir -p _perf/assets/backgrounds/library
          unzip -oq "$PACK" -d _perf/assets/backgrounds/library
          test "$(find _perf/assets/backgrounds/library -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 15
          rm -f _perf/assets/backgrounds/garba15-*.zip

      - name: Install Chromium measurement runtime
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start fixture
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _perf >/tmp/playgarba-perf.log 2>&1 &
          echo $! > /tmp/playgarba-perf.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/playgarba-perf.log
          exit 1

      - name: Run seven-pair cold/warm measurement
        run: |
          node scripts/performance/measure-player.mjs \
            --origin=http://127.0.0.1:4173 \
            --runs=7 \
            --output=/tmp/issue-450-final-performance.json

      - name: Record environment identity
        if: always()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
            echo "node=$(node --version)"
            echo "playwright=$(node -p \"require('@playwright/test/package.json').version\")"
            npx playwright --version
          } | tee /tmp/issue-450-environment.txt

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-450-final-performance
          path: |
            /tmp/issue-450-final-performance.json
            /tmp/issue-450-environment.txt
            /tmp/playgarba-perf.log
          if-no-files-found: warn
          retention-days: 14
