name: PGA Home + Live validate

on:
  pull_request:
    paths:
      - 'src/pga/home/live-snapshot.js'
      - 'src/pga/home/tests/live-snapshot.test.mjs'
      - 'src/pga/home/model.js'
      - 'src/pga/presence/model.js'
      - 'scripts/lib/validate-pga-home-live.mjs'
      - '.github/workflows/pga-home-live-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/pga/home/live-snapshot.js'
      - 'src/pga/home/tests/live-snapshot.test.mjs'
      - 'src/pga/home/model.js'
      - 'src/pga/presence/model.js'
      - 'scripts/lib/validate-pga-home-live.mjs'
      - '.github/workflows/pga-home-live-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Home + Live snapshot fixtures
        shell: bash
        run: |
          set -o pipefail
          node src/pga/home/tests/live-snapshot.test.mjs 2>&1 | tee /tmp/pga-home-live-fixtures.log
      - name: Validate composition purity and delegation
        run: node scripts/lib/validate-pga-home-live.mjs
      - name: Upload fixture diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pga-home-live-fixture-diagnostics
          path: /tmp/pga-home-live-fixtures.log
          if-no-files-found: ignore
