name: Issue 1325 mobile quality verification

on:
  pull_request:
    paths:
      - 'nonstop-browser.js'
      - '.github/workflows/issue-1325-mobile-quality-verify.yml'
      - 'scripts/issue-1325-mobile-quality-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-1325-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v6
        with:
          ref: fix/issue-1325-short-landscape-player

      - name: Apply authoritative short-landscape spacing correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('nonstop-browser.js')
          source = path.read_text()
          old = '''      @media(max-height:560px) and (orientation:landscape){
              .player-shell{grid-template-rows:auto auto auto auto auto!important}
              #genreStrip{grid-row:4!important;align-self:end!important}
              #browseActions{grid-row:5!important;align-self:start!important}
            }'''
          new = '''      @media(max-height:560px) and (orientation:landscape){
              html body .app .player-shell{
                grid-template-rows:auto auto auto 11px 0 auto 36px auto!important;
                padding-top:52px!important
              }
              html body .app #genreStrip{grid-row:6!important;align-self:end!important}
              html body .app #browseActions{grid-row:8!important;align-self:start!important}
            }'''
          if old in source:
              if source.count(old) != 1:
                  raise SystemExit('Expected exactly one existing #1325 short-landscape block')
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('Expected #1325 short-landscape block not found')
          PY
          git diff --check -- nonstop-browser.js
          if ! git diff --quiet -- nonstop-browser.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add nonstop-browser.js
            git commit -m 'Fix short-landscape player geometry for #1325'
            git push origin HEAD:fix/issue-1325-short-landscape-player
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build catalogue data
        run: npm run catalogue

      - name: Prepare production-equivalent mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _mobile_quality
          mkdir -p _mobile_quality/explore _mobile_quality/catalogue

          cp \
            index.html \
            app.js \
            simple-runtime.js \
            provider-runtime.js \
            player-continuity.js \
            youtube-player-runtime.js \
            nonstop-browser.js \
            sw.js \
            manifest.webmanifest \
            offline.html \
            _mobile_quality/
          cp -R assets data _mobile_quality/

          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _mobile_quality/explore/
          cp \
            src/catalogue/index.html \
            src/catalogue/catalogue.css \
            src/catalogue/catalogue.js \
            src/catalogue/listening-library.js \
            _mobile_quality/catalogue/

          cat \
            styles/00-foundation-and-player.css \
            styles/10-browser-and-shell.css \
            styles/20-responsive-and-accessibility.css \
            styles/30-product-polish.css \
            styles/40-accessibility-states.css \
            styles/50-discovery-and-performance.css \
            styles/60-runtime-and-provider.css \
            styles/70-mobile-playback-coordination.css \
            styles/80-genre-icon-images.css \
            > _mobile_quality/styles.css

          cat \
            app.js \
            assets/runtime/seek-state.js \
            assets/runtime/continuous-set-state.js \
            > _mobile_quality/app.js

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const readJson = (file) => JSON.parse(readFileSync(file, 'utf8'));
          const writeJson = (file, value) => writeFileSync(file, `${JSON.stringify(value)}\n`);
          const songsPath = '_mobile_quality/data/songs.json';
          const indexPath = '_mobile_quality/data/catalogue/index.json';
          const allSongs = readJson(songsPath);
          const requiredIds = new Set([
            'bollywood-dandiya-2014-01-non-stop-bollywood-dandiya-garbe-ki-raat-hai-2014',
            'ochhav-2023-01-ochhav-theme',
          ]);
          const selected = [];
          const selectedIds = new Set();
          const genreCounts = new Map();
          const keep = (song) => {
            if (!song?.id || selectedIds.has(song.id)) return;
            selected.push(song);
            selectedIds.add(song.id);
          };
          for (const song of allSongs) {
            if (requiredIds.has(song?.id)) keep(song);
            const genre = String(song?.genre || 'traditional');
            const count = genreCounts.get(genre) || 0;
            if (count >= 24) continue;
            keep(song);
            genreCounts.set(genre, count + 1);
          }
          for (const id of requiredIds) {
            if (!selectedIds.has(id)) throw new Error(`Required mobile-quality song missing: ${id}`);
          }
          const index = readJson(indexPath);
          writeJson(songsPath, selected);
          writeJson(indexPath, { ...index, discovery: { ...(index.discovery || {}), artists: [] } });
          console.log(`Mobile quality catalogue: ${allSongs.length} -> ${selected.length} real songs.`);
          NODE

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Start mobile fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _mobile_quality >/tmp/playgarba-mobile-quality.log 2>&1 &
          echo $! > /tmp/playgarba-mobile-quality.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/playgarba-mobile-quality.log
          exit 1

      - name: Measure effective 844x390 geometry
        run: node scripts/issue-1325-mobile-quality-smoke.mjs

      - name: Fetch unchanged #1302 matrix
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/ruddvz/garba/fb91577963002931ff3443cf2cd32abebdc37ee7/scripts/mobile-quality/mobile-quality-smoke.mjs \
            -o scripts/issue-1325-mobile-quality-smoke.mjs
          printf '%s\n' 'Pinned QA source: fb91577963002931ff3443cf2cd32abebdc37ee7 / scripts/mobile-quality/mobile-quality-smoke.mjs (Git blob f965d041e54b9c6ad1fa5ced6bfafaaebed95f27)' > /tmp/qa-source.txt

      - name: Run unchanged Chromium and WebKit matrix
        run: node scripts/issue-1325-mobile-quality-smoke.mjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-1325-mobile-quality-verification
          path: |
            artifacts/mobile-quality
            /tmp/issue1325-layout.json
            /tmp/playgarba-mobile-quality.log
            /tmp/qa-source.txt
          if-no-files-found: ignore
          retention-days: 7
