name: Temporary listening flow patch

on:
  push:
    branches:
      - codex/listening-flow-287

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/listening-flow-287
      - name: Harden listening flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, before, after, label):
              p = Path(path)
              text = p.read_text()
              if after in text:
                  return
              if before not in text:
                  raise SystemExit(f"Patch target missing: {label}")
              p.write_text(text.replace(before, after, 1))

          patch('app.js',
          """function sanitiseManualQueue() {
            const known = new Set(state.songs.map((song) => song.id));
            const next = [];
            const seen = new Set();
            for (const id of state.manualQueue) {
              if (!known.has(id) || id === state.songId || seen.has(id)) continue;
              seen.add(id);
              next.push(id);
              if (next.length >= 30) break;
            }
            const changed = next.length !== state.manualQueue.length || next.some((id, index) => id !== state.manualQueue[index]);
            state.manualQueue = next;
            if (changed) persistManualQueue();
          }""",
          """function sanitiseManualQueue() {
            const byId = new Map(state.songs.map((song) => [song.id, song]));
            const next = [];
            const seen = new Set();
            for (const id of state.manualQueue) {
              const song = byId.get(id);
              if (!song?.youtubeId || id === state.songId || seen.has(id)) continue;
              seen.add(id);
              next.push(id);
              if (next.length >= 30) break;
            }
            const changed = next.length !== state.manualQueue.length || next.some((id, index) => id !== state.manualQueue[index]);
            state.manualQueue = next;
            if (changed) persistManualQueue();
          }""", 'queue playable sanitiser')

          patch('app.js',
          """  if (!state.songs.some((song) => song.id === songId)) return;
            if (state.manualQueue.includes(songId)) {""",
          """  const queuedSong = state.songs.find((song) => song.id === songId);
            if (!queuedSong) return;
            if (!queuedSong.youtubeId) {
              showToast('This song is not YouTube-ready yet.');
              return;
            }
            if (state.manualQueue.includes(songId)) {""", 'queue only executable YouTube songs')

          patch('app.js',
          """    const queueAction = document.createElement('button');
              queueAction.type = 'button';
              queueAction.className = 'song-queue-action';
              queueAction.setAttribute('aria-label', queued ? `Remove ${song.title} from Up next` : `Play ${song.title} next`);""",
          """    const queuePlayable = Boolean(song.youtubeId);
              const queueAction = document.createElement('button');
              queueAction.type = 'button';
              queueAction.className = 'song-queue-action';
              queueAction.hidden = !queuePlayable || song.id === state.songId;
              queueAction.disabled = !queuePlayable || song.id === state.songId;
              queueAction.setAttribute('aria-label', queued ? `Remove ${song.title} from Up next` : `Play ${song.title} next`);""", 'hide unsafe queue action')

          patch('app.js',
          """      selectSong(previousId, { keepSheet: true, preservePlayback: true, fromHistory: true });""",
          """      selectSong(previousId, { keepSheet: true, preservePlayback: true, preserveContext: true, fromHistory: true });""", 'previous preserves listening context')

          patch('app.js',
          """  url.searchParams.delete('source');
            history.replaceState""",
          """  url.searchParams.delete('source');
            url.searchParams.delete('library');
            history.replaceState""", 'consume My Garba deep link')

          patch('app.js',
          """    browse: params.get('browse') === '1',
            };""",
          """    browse: params.get('browse') === '1',
              myGarba: params.get('library') === 'my-garba',
            };""", 'resolve My Garba deep link')

          patch('app.js',
          """    if (initial.browse) openSheet('all', { snap: 'full', history: false });
              updateUrl();""",
          """    if (initial.myGarba) openSheet('favourites', { snap: 'full', history: false });
              else if (initial.browse) openSheet('all', { snap: 'full', history: false });
              updateUrl();""", 'open My Garba deep link')

          patch('src/catalogue/listening-library.js',
          """    .personal-listening-section .section-title-row{margin-bottom:14px}
              .personal-listening-rail""",
          """    .personal-listening-section .section-title-row{margin-bottom:14px;align-items:center;justify-content:flex-start}
              .personal-listening-section .section-title-row p{margin-left:auto}
              .personal-listening-open{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:34px;margin-left:14px;padding:0 11px;border:1px solid rgba(255,255,255,.11);border-radius:999px;color:rgba(255,248,236,.72);background:rgba(255,255,255,.035);font-size:.7rem;font-weight:760;text-decoration:none;transition:border-color .18s ease,background .18s ease,color .18s ease}
              .personal-listening-open:hover,.personal-listening-open:focus-visible{color:var(--gold);border-color:rgba(231,201,143,.28);background:rgba(231,201,143,.055)}
              .personal-listening-rail""", 'My Garba open link styles')

          patch('src/catalogue/listening-library.js',
          """    @media(max-width:640px){.personal-listening-section{margin-bottom:36px}.personal-listening-rail""",
          """    @media(max-width:640px){.personal-listening-section{margin-bottom:36px}.personal-listening-open{margin-left:auto}.personal-listening-rail""", 'mobile My Garba link placement')

          patch('src/catalogue/listening-library.js',
          """  head.append(heading, description);

            const rail""",
          """  const openMyGarba = document.createElement('a');
            openMyGarba.className = 'personal-listening-open';
            openMyGarba.href = '../?library=my-garba';
            openMyGarba.textContent = 'Open';
            openMyGarba.setAttribute('aria-label', 'Open all songs in My Garba');
            head.append(heading, description, openMyGarba);

            const rail""", 'My Garba open link')

          patch('src/catalogue/listening-library.js',
          """  rail.setAttribute('aria-label', 'Your PlayGarba listening');""",
          """  rail.setAttribute('aria-label', 'My Garba saved songs and continue listening');""", 'My Garba rail label')

          validator = Path('scripts/lib/validate-listening-flow.mjs')
          text = validator.read_text()
          text = text.replace("  'state.listeningHistory.pop()',\n", "  'state.listeningHistory.pop()',\n  \"if (!queuedSong.youtubeId)\",\n  'preserveContext: true, fromHistory: true',\n  \"params.get('library') === 'my-garba'\",\n")
          text = text.replace("requireMarker(library, \"heading.textContent = 'My Garba';\", 'Explore My Garba section missing');", "requireMarker(library, \"heading.textContent = 'My Garba';\", 'Explore My Garba section missing');\nrequireMarker(library, \"openMyGarba.href = '../?library=my-garba';\", 'Explore must expose a low-clutter My Garba entry point');")
          validator.write_text(text)
          PY
      - name: Commit hardened sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js src/catalogue/listening-library.js scripts/lib/validate-listening-flow.mjs
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "Harden queue playback and My Garba access"
          git push origin HEAD:codex/listening-flow-287
