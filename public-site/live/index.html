<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://live.playgarba.com/" />
  <meta http-equiv="refresh" content="0; url=https://live.playgarba.com/" />
  <title>Opening PlayGarba</title>
  <script>
    (() => {
      const target = new URL('https://live.playgarba.com/');
      const incoming = new URLSearchParams(window.location.search);
      for (const [key, value] of incoming.entries()) target.searchParams.append(key, value);
      target.hash = window.location.hash;
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Opening the <a href="https://live.playgarba.com/">PlayGarba player</a>.</p>
</body>
</html>
