        if (!(target instanceof HTMLElement)) return;

        target.focus({ preventScroll: true });
        revealHorizontally(releaseRail, target);
      }

      function bindRail(rail, label) {
        normalizeRail(rail, label);
        if (rail.dataset.keyboardRailBound === 'true') return;
        rail.dataset.keyboardRailBound = 'true';

        rail.addEventListener('keydown', (event) => {
          if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          const current = event.target instanceof Element ? event.target.closest('.release-card') : null;
          if (!(current instanceof HTMLElement) || current.parentElement !== rail) return;
          const cards = cardsFor(rail);
          const currentIndex = cards.indexOf(current);
          if (currentIndex < 0 || !cards.length) return;
          let nextIndex = currentIndex;
          if (event.key === 'ArrowLeft') nextIndex = Math.max(0, currentIndex - 1);
          if (event.key === 'ArrowRight') nextIndex = Math.min(cards.length - 1, currentIndex + 1);

        bindRail(releaseRail, 'Albums and releases');

        });

      }

      function queueRefreshRails() {
        if (refreshQueued) return;
        refreshQueued = true;
        queueMicrotask(refreshRails);

      window.addEventListener('pageshow', queueRefreshRails);
      queueRefreshRails();
    })();

    function primeSongHandoff(link) {

    }
    if (detail) {
      new MutationObserver(syncAmbient).observe(detail, { attributes: true, attributeFilter: ['hidden'] });
    }
    window.addEventListener('popstate', () => queueMicrotask(syncAmbient));
    window.addEventListener('hashchange', () => queueMicrotask(syncAmbient));
    window.addEventListener('pageshow', () => {
      body.classList.remove('route-leaving');
      clearSongHandoffNames();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !detail?.hidden || event.defaultPrevented || !closeExplore) return;
      event.preventDefault();
      location.assign(closeExplore.href);
    });

    queueVisualRefresh();
    syncAmbient();
  </script>
</body>
</html>
