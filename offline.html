<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15182a" />
  <title>GARBA · Offline</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 50% 30%, #28243d, #111323 65%); color: #f6ecd7; text-align: center; }
    main { max-width: 440px; }
    h1 { font: 400 clamp(44px, 10vw, 72px)/1 Georgia, serif; margin: 0 0 18px; }
    p { margin: 0; color: rgba(246,236,215,.7); line-height: 1.6; }
    button { margin-top: 26px; border: 1px solid rgba(246,236,215,.3); background: transparent; color: inherit; padding: 11px 18px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>GARBA</h1>
    <p>The app shell is available offline. Reconnect to refresh the song catalogue or stream tracks that are not stored on your device.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
